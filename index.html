<script>
const sourcePages=[{"type":"cover","title":"STERNENRING","sub":"第一巻","text":""},{"type":"chapter","title":"プロローグ","sub":"災厄の星","text":""},{"type":"text","text":"かつて、空には二つの星があった。\n\nひとつは、人々の生きる星――アストラル。\n\nそしてもうひとつは、夜空を巡る若き星――ノヴァ。\n\nノヴァは、美しい星だったという。\n\n青く、白く、ときに淡い紅を帯び、その輝きは遠い海の向こうからでも見えた。\n\nだが、その美しさの内には、人の手に余るほどの力が満ちていた。\n\nやがてノヴァの力は均衡を失い、災厄となってアストラルへ降り注いだ。\n\n空は裂けた。\n\n大地は焼け、海は荒れ、森は消えた。\n\n天より落ちた光は、のちに《ノヴァの涙》と呼ばれた。\n\n数えきれぬ命が失われた。\n\nそして災厄とともに現れた異形の獣たちは、人々の町を襲った。\n\n星獣。\n\n今なおアストラル各地に残る、災厄の名残である。\n\nそれでも、人は滅びなかった。\n\n世界の理を読み解き、目には見えぬ力の流れを捉え、それを術式として編み上げた。\n\n炎を生み、水を動かし、傷を癒やし、堅牢な壁を築く。\n\n魔法。\n\nそれは、人が災厄に抗うために手にした叡智だった。\n\nそして長い戦いの果て、人々はついに天へ巨大な光の輪を築いた。\n\n星環。\n\nその光はノヴァの災厄を退け、荒れ果てたアストラルに再び朝をもたらした。\n\n以来、人々は星環を見上げ、祈る。\n\n今日も世界が続いていることを。\n\n明日もまた朝が来ることを。"},{"type":"text","text":"そして――二度と、災厄の星がこの地へ降りることのないように。"},{"type":"quote","text":"星暦以前、若き星ノヴァより災い降りたり。\n\n天より落つる光は大地を焼き、海を荒らし、数多の命を奪えり。\n\nされど人は屈せず。世界の理を究め、魔法を編み、ついには天に星環を築けり。\n\n星環の光、災いを退け、アストラルに再び朝をもたらす。\n\nゆえに後世の民よ、忘るるなかれ。\n\nノヴァの災いを。\n\n人の叡智を。\n\n我らを守りし星環の光を。\n\n――『アストラル史』第一巻・第三章「災厄の星」より"},{"type":"chapter","title":"第一章","sub":"星環祭","text":""},{"type":"text","text":"「高くない？」\n\nナハトは串焼きを目の高さまで持ち上げた。\n\n炭火で焼かれた肉から脂が落ち、じゅ、と音を立てる。立ちのぼった煙が、額にかかった乱れた黒髪をかすめて流れていった。\n\n香辛料の匂いは申し分ない。\n\n問題は、その横に立てられた値札だった。\n\n――大銅貨六枚。\n\n「祭りなんだから、そんなもんだろ」\n\n隣から返ってきた声に、ナハトは顔を向けた。\n\nナハトはほとんど全身が黒い。大きな襟巻きに黒い外套、腕には使い込まれた布が巻かれ、灰色の腰布の脇には、この辺りではあまり見かけない細身の刀が差してある。\n\n乱れた黒髪の隙間から覗く青灰色の目だけなら、少しくらい近寄りがたい男に見えなくもない。\n\n対するヴォルトは、陽の光を拾う金色の髪を後ろで短く束ね、黒い長衣の内側に暖かな黄褐色を覗かせていた。片手には一本の杖。腰元には小さな工具入れ。\n\nもっとも、二人とも口を開けば、その第一印象は長く続かない。\n\n「祭りだからって肉の価値が三割増しになるの、納得いかないんだけど」\n\n「じゃあ買わなきゃいいだろ」\n\n「いや、買うけど」\n\n「買うのかよ」\n\nナハトは懐から大銅貨を六枚取り出した。\n\n店主が威勢よく笑う。\n\n「毎度！」\n\n渡された串焼きにかぶりつく。\n\n数秒。\n\n「うまい」\n\n「満足してんじゃねえか」\n\n「味と価格への不満は両立するんだよ、ヴォルト」\n\n「面倒くせえ客だな」\n\nナハトは笑った。\n\n祭りの喧騒が、二人の横を流れていく。\n\n国境都市ノルン。\n\n普段は商人と傭兵、それから国境を行き交う旅人たちで騒がしい街だが、今日はいつも以上に人が多かった。\n\n年に一度の星環祭。\n\n大通りには白と銀の布が渡され、軒先には星環を模した輪飾りが揺れている。\n\n屋台から漂う料理の匂い。\n\n大道芸人を囲む子供たち。\n\n楽器を鳴らしながら通りを歩く楽団。\n\nそして建物の間には、色とりどりの光が浮かんでいた。\n\n魔法で灯された祭りの明かりだ。\n\n頭上には、それらすべてを包み込むように巨大な光の弧がある。\n\n星環。\n\n青空を横切る、幾重もの細い光。\n\nあまりにも昔からそこにあるため、足を止めて見上げる者は少ない。\n\nだが今日だけは違った。\n\n「お兄ちゃん、見て！」\n\n近くで子供の声がした。"},{"type":"text","text":"小さな少年が両手を前へ突き出している。\n\nその前に、淡い光の線が浮かんだ。\n\n線は円を描き、その内側へさらに細かな図形を組み上げていく。\n\n少年は舌を噛みそうになりながら短い言葉を唱えた。\n\n一瞬遅れて、小さな光が宙へ飛び上がった。\n\nぱん、と弾ける。\n\n母親が拍手した。\n\n少年は得意げだった。\n\nナハトも串焼きを片手に拍手する。\n\n「おー」\n\n「お前が褒めてどうすんだ」\n\n「いや、俺にはできないからさ」\n\n「胸張って言うことじゃねえだろ」\n\n「適材適所ってやつ」\n\n「お前の場合、適所がだいたい斬るところなんだよ」\n\n二人は再び歩き出す。\n\nそのとき、道端の屋台から声が飛んできた。\n\n「おい兄ちゃん！　ちょっと見てくれ！」\n\nヴォルトが足を止めた。\n\n「俺？」\n\n「そうそう。さっきからこいつが点いたり消えたりしてんだよ」\n\n店主が指した先では、祭り用の小さな導機灯が不規則に明滅していた。\n\nヴォルトはしゃがみ込む。\n\n外装を開け、内部を覗いた。\n\n「……循環が詰まってるな」\n\n「直せるか？」\n\n「たぶん」\n\nナハトは串焼きを食べながら眺める。\n\n「祭りの日まで仕事するなんて偉いねえ」\n\n「誰のせいで金が減ってると思ってんだ」\n\n「俺の串焼き、大銅貨六枚だけど」\n\n「昨日の宿代を忘れんな」\n\n「あれは必要経費」\n\n「酒まで？」\n\n「精神衛生費」\n\n「便利な言葉覚えやがって」\n\nヴォルトの指先に淡い光が宿った。\n\n小さな術式が組み上がり、導機灯の内部へ流れ込む。\n\n一度、光が消える。\n\n次の瞬間。\n\nぱっ、と安定した明かりが灯った。\n\n「おお！」\n\n店主が声を上げた。"},{"type":"text","text":"「助かった！　ほら、これ持ってけ！」\n\n焼き菓子が二つ、押しつけられる。\n\nヴォルトは一つをナハトへ放った。\n\n「働いてないけど？」\n\n「いらないなら返せ」\n\n「いただきます」\n\n「早えよ」\n\nそんなやり取りをしながら、二人は人波へ戻った。\n\n広場へ近づくほど、人の数は増えていく。\n\nやがて鐘が鳴った。\n\n一度。\n\n二度。\n\n三度。\n\nざわめきが静まっていく。\n\n広場の中央に設けられた壇上へ、白い祭服をまとった神官が上がった。\n\nその胸には、銀色の輪。\n\n星環教会の紋章。\n\n「アストラルに生きる、すべての人々へ」\n\nよく通る声だった。\n\n「我らの祖先は、災厄に屈することなく立ち上がりました」\n\n人々が空を見上げる。\n\n「知恵を束ね、魔法を編み、そして天に星環を築いたのです」\n\n祈る者がいた。\n\n胸の前で手を組む者。\n\n子供を抱き上げる父親。\n\n笑顔で空を見上げる老人。\n\n「星環の光が、今日も我らを守ってくださることに感謝を」\n\nナハトも何となく空を見上げた。\n\n巨大な光の輪が、青空の向こうへ続いている。\n\n「何考えてる？」\n\nヴォルトが聞いた。\n\n「いや」\n\nナハトは最後の肉を串から抜いた。\n\n「でかいなって」\n\n「感想それだけか！」\n\n「じゃあヴォルトは？」\n\n「昔の人間はよくあんなもん造ったなって」\n\n「似たようなもんじゃん」\n\n「一緒にすんな」\n\n鐘が鳴った。\n\n同時に、街のあちこちから光が打ち上がる。\n\n魔法で作られた光球が空へ昇り――\n\n弾けた。\n\n赤。\n\n青。\n\n金。\n\n無数の光が星環の下を彩る。\n\n歓声が上がった。\n\nナハトも思わず目を細めた。\n\n「おお。これは――」"},{"type":"text","text":"その言葉は、最後まで続かなかった。\n\n低い音がした。\n\n遠くから。\n\n地面を震わせるような、唸り声。\n\n歓声が止まる。\n\nもう一度。\n\n今度は近い。\n\n誰かが叫んだ。\n\n「星獣だ！」\n\n人波が割れた。\n\n広場へ続く通りの向こうから、青白い影が飛び込んでくる。\n\n一頭。\n\n二頭。\n\n三頭。\n\n狼に似ていた。\n\nだが普通の狼よりはるかに大きい。\n\n黒に近い毛並みの隙間を、青白い光が脈打つように走っている。\n\n悲鳴が上がった。\n\n母親が子供を抱き寄せる。\n\n屋台が倒れる。\n\n人々が一斉に逃げ始めた。\n\n「ナハト！」\n\nヴォルトが叫ぶ。\n\n「見えてる！」\n\nナハトの手は、すでに刀の柄にあった。\n\nだが。\n\n抜かなかった。\n\n星獣が、一人の男へ向かって走る。\n\n男は転んだ。\n\n逃げられない。\n\n星獣が迫る。\n\n「――っ！」\n\n男が頭を抱えた。\n\nしかし。\n\n星獣は、その横を走り抜けた。\n\n「……は？」\n\nナハトの眉が動いた。\n\n別の一頭も同じだった。\n\n逃げ惑う人々の間を縫う。\n\n人を追っているようには見えない。\n\n「何してんだ、あいつら」\n\nヴォルトが呟いた。\n\n「知らない」\n\nナハトは星獣の視線を追った。\n\n何かを探している。\n\nそんな動きだった。\n\nだが、次の瞬間。\n\n「撃て！」\n\n王国兵の声が響いた。\n\n数人の魔法使いが杖を向ける。\n\n術式が展開される。\n\n光。\n\n熱。\n\n風圧。\n\n三つの攻撃が星獣へ降り注いだ。\n\n一頭が吹き飛んだ。\n\n石畳を転がる。\n\n青白い光が激しく明滅した。\n\nそして。\n\n咆哮。\n\n空気が震えた。\n\n星獣たちが、一斉に牙を剥いた。\n\n「……あーあ」\n\nナハトが刀を抜く。\n\n「怒った」\n\n「感想言ってる場合か！」"},{"type":"text","text":"一頭が兵士へ飛びかかった。\n\nナハトが走る。\n\n正面からは受けない。\n\n半歩。\n\n軸をずらす。\n\n爪が頬のすぐ横を通過した。\n\n刀の腹を獣の前脚へ添える。\n\n力の向きだけを変える。\n\n巨体が地面へ流れた。\n\n「よっ、と」\n\n倒れた星獣へ追撃はしない。\n\nそのまま距離を取る。\n\n「相変わらず気持ち悪い避け方するな！」\n\n「褒め言葉？」\n\n「違う！」\n\n別の星獣が迫る。\n\nナハトは呼吸を見る。\n\n前脚。\n\n肩。\n\n視線。\n\n来る。\n\n刀を構えた。\n\n――その瞬間。\n\n星獣が止まった。\n\nナハトも止まる。\n\n数歩の距離。\n\n青白い瞳。\n\n星獣は、じっとナハトを見ていた。\n\n「……何？」\n\n返事はない。\n\n当然だ。\n\nなのに。\n\n胸の奥がざわついた。\n\n服の下。\n\n誰にも見せていない場所が、熱を持つ。\n\n星痣。\n\n「…………」\n\nナハトから笑みが消えた。\n\n懐かしい。\n\nなぜか。\n\nそんな言葉が浮かんだ。\n\n会ったことなどない。\n\n星獣なんて、これまで何頭も斬ってきた。\n\nなのに。\n\n目の前の獣だけは――\n\n知っているような気がした。\n\n「ナハト！」\n\nヴォルトの声。\n\n光が走った。\n\n星獣が跳び退く。\n\nその瞬間、何かが切れた。\n\n星獣はナハトから視線を外す。\n\n一頭が吠えた。\n\n三頭は身を翻し、通りの向こうへ走り去っていった。\n\n兵士たちが追おうとする。\n\nだが人混みが邪魔をする。\n\nやがて、その姿は見えなくなった。\n\n広場に静寂が残った。\n\n倒れた屋台。\n\n割れた皿。\n\n焦げた石畳。\n\n泣いている子供。\n\nそして、呆然としている人々。\n\nヴォルトが近づいてきた。\n\n「怪我は？」\n\n「ない」\n\n「……お前」\n\n「ん？」\n\n「今の星獣」\n\nナハトは刀を鞘へ戻した。\n\n「うん」"},{"type":"text","text":"「なんで止まった？」\n\n一拍。\n\nナハトはいつもの顔に戻った。\n\n「俺の美貌に見惚れたんじゃない？」\n\n「真面目に聞いてんだよ」\n\n「俺も真面目に答えてる」\n\n「どこがだ」\n\nナハトは笑った。\n\nけれど。\n\n服の下の熱は、まだ消えていなかった。\n\n◇\n\n一時間もすると、祭りは再び動き始めた。\n\n壊れた屋台を直す者。\n\n散らばった食器を拾う者。\n\n怪我人を治療する者。\n\nそして。\n\n「串焼き、焼き直したよー！」\n\n商売を再開する者。\n\n「強いな、人類」\n\nナハトが言った。\n\n「お前、また買う気じゃないだろうな」\n\n「さすがに買わないよ」\n\n「本当か？」\n\n「大銅貨四枚に値下がりしてる」\n\n「やめろ」\n\n「でもさ」\n\nナハトは少しだけ笑った。\n\n「こういうの、嫌いじゃない」\n\nヴォルトが横を見る。\n\n「何が？」\n\n「壊れたら直して、また祭りするところ」\n\n一瞬だけ、ヴォルトが黙った。\n\n「……そうだな」\n\nそれ以上は言わなかった。\n\n二人とも。\n\n昔、一度。\n\n直せなかったものを知っている。\n\n◇\n\n翌朝。\n\n銀鹿亭の掲示板の前で、ナハトは一枚の依頼書を剥がした。\n\n《エルデ森林・星獣追跡調査》\n\n昨夜、ノルンへ侵入した星獣の足跡が、エルデ森林方面へ続いている。\n\n討伐ではない。\n\n行動経路の確認。\n\n巣の有無。\n\n異常発生の原因調査。\n\n報酬――大銀貨八枚。\n\nナハトは紙を眺める。\n\n「八枚」\n\n後ろからヴォルトが覗き込んだ。\n\n「悪くないな」\n\n「昨日の串焼き、何本買える？」\n\n「そういう計算やめろ」\n\n「百三十本くらい？」\n\n「計算すんなって言っただろ」\n\nナハトは依頼書を折りたたんだ。"},{"type":"text","text":"昨日の青白い瞳が、頭から離れない。\n\nそして。\n\nあのとき感じた熱も。\n\n「行くか」\n\nヴォルトが言った。\n\nナハトは少しだけ笑った。\n\n「行こう」\n\n昼前。\n\n二人は国境都市ノルンを出た。\n\n目指すは、エルデ森林。"},{"type":"chapter","title":"第二章","sub":"エルデ森林","text":""},{"type":"text","text":"ノルンを出て半日。\n\n石畳だった街道はいつの間にか細い土の道へ変わり、その先を、深い緑が覆っていた。\n\nエルデ森林。\n\nレグナス王国の東端に広がる古い森である。\n\n背の高い木々が幾重にも枝を伸ばし、昼だというのに森の奥は薄暗い。葉の隙間から落ちる光が、風に揺れて地面をまだらに照らしていた。\n\nナハトはその入口で足を止めた。\n\n「さて」\n\n腰の刀に手を添え、森を見上げる。\n\n「帰るか」\n\n「早い」\n\n後ろから即座にヴォルトの声が飛んだ。\n\n「まだ入ってすらいないぞ」\n\n「危険を感じた」\n\n「何に」\n\n「森に」\n\n「見れば分かる」\n\n「俺、都会育ちだからさ」\n\n「どの口が言ってんだ」\n\nヴォルトは呆れた顔で杖を地面についた。その先端が、こつ、と乾いた音を立てる。\n\nナハトは肩をすくめると、森へ踏み込んだ。\n\n「冗談だよ」\n\n「お前の冗談は、たまに本気かどうか分からん」\n\n「付き合い長いんだから、そろそろ分かってくれよ」\n\n「付き合い長いから分からないんだよ」\n\nそんな会話をしながら、二人は森の中を進んでいった。\n\nしばらくは、人の通った跡があった。薪を拾う者や狩人が使うのだろう。細い道が木々の間を縫っている。\n\nだが、それもじきに消えた。\n\n代わりに現れたのは、昨日まで人の街を騒がせていたものの痕跡だった。\n\nナハトがしゃがみ込む。\n\n湿った土に、大きな窪みが残っていた。人間の足跡ではない。\n\nヴォルトも隣から覗き込んだ。\n\n「星獣か？」\n\n「たぶん」\n\nナハトは指先で土をなぞった。\n\n「三……いや、四体」\n\n「分かるのか？」\n\n「一番小さいのが、でかいのの跡を踏んでる」\n\n「ほう」\n\n「で、こっちが昨日、お前に蹴られたやつ」\n\n「なんでそこまで分かるんだよ」\n\n「傷ついた右脚をかばってる」\n\nヴォルトが足跡を見る。左右で深さが違う。\n\n言われてみれば分かる。だが、言われるまで気づかなかった。\n\n「……お前、本当に傭兵か？」\n\n「失礼だな。優良傭兵だよ」\n\n「猟師の間違いじゃないのか」\n\n「転職するなら紹介してくれ。楽で給料がいいところ」\n\n「そんな猟師がいるなら俺がなる」\n\nナハトは笑いながら立ち上がった。\n\n足跡は森の奥へ続いている。\n\n昨日、星環祭に現れた星獣たち。\n\n討伐ではなく、今回は追跡調査。\n\nどこから来たのか。なぜ街へ現れたのか。それを確かめるのが仕事だった。\n\nナハトが歩き出す。\n\n数歩進んで――止まった。\n\n「ヴォルト」\n\n「ん？」\n\n「これ」\n\n一本の若木を指さす。\n\n幹には、大きな爪痕が残っていた。星獣のものだろう。\n\nだが、その隣。細い枝が一本、横へ押し退けられている。折れてはいない。\n\nさらに先を見る。\n\n草も同じだった。踏み荒らされた場所と、妙にきれいに残った場所がある。\n\nヴォルトが眉を寄せた。\n\n「……避けた？」\n\n「さあ」\n\nナハトは答えず、先へ進む。\n\nしばらくすると、小さな沢が現れた。\n\n透明な水が岩の間を流れている。そこにも足跡はあった。\n\n星獣たちは沢を渡っていた。\n\nだが、少し上流。水辺に咲いていた白い花の群れだけは、踏まれていない。\n\nまるで、その場所を迂回したように足跡が曲がっていた。\n\nヴォルトが腕を組む。\n\n「……昨日もそうだったな」\n\n「何が？」\n\n「人だよ」\n\nナハトは答えない。\n\n「広場に入ってきたのに、最初から人を襲ってなかった」\n\n「そうだったっけ？」\n\n「お前も見てただろ」\n\n「祭りの串焼きしか見てなかった」\n\n「お前、その設定で押し通すつもりか？」\n\nナハトが笑う。\n\nけれど、歩みは止めなかった。\n\n森の奥へ。さらに奥へ。星獣の足跡を追っていく。\n\nやがて、木々の様子が変わり始めた。\n\n古い。そう感じた。\n\n幹は太く、根は地面を這い、苔が深く覆っている。\n\n風が吹くたび、遥か頭上で葉が擦れ合った。\n\n街の音は、もう聞こえない。\n\n鳥の声。水の音。枝が揺れる音。それだけだった。\n\nヴォルトが小さく息を吐く。\n\n「嫌な静けさだな」\n\n「そう？」\n\n「お前は？」\n\nナハトは周囲を見回した。\n\n「……なんか、落ち着く」\n\n「森育ちだったか？」\n\n「だから都会育ちだって」\n\n「設定が雑なんだよ」\n\nナハトは笑った。\n\nだが、その笑みが、一瞬だけ消えた。\n\n風が吹いた。\n\n森の匂いがする。湿った土。木の葉。水。\n\n知らないはずなのに。\n\nどこかで嗅いだことがあるような――。\n\n「ナハト？」\n\n「ん？」\n\nいつもの顔に戻る。\n\n「腹減ったな」\n\n「話を逸らすな」\n\n「朝飯少なかっただろ」\n\n「食っただろ。お前、俺のパンまで取っただろ」\n\n「友達料金」\n\n「返せ」\n\nそのときだった。\n\n――ガサッ。\n\n前方の茂みが揺れた。\n\n二人の動きが同時に止まる。\n\nヴォルトの手が杖へ。ナハトの右手が刀の柄へ移る。\n\nもう一度。\n\n――ガサ。\n\n近い。\n\nナハトがわずかに腰を落とした。\n\n音の方向。距離。風向き。枝の揺れ。\n\n「一体」\n\n小声で言う。\n\n「昨日の？」\n\n「たぶん」\n\n茂みの奥。\n\n二つの光が浮かんだ。\n\n目だった。\n\n巨大な影が、ゆっくりと姿を現す。\n\n星獣。\n\n昨日、ノルンの広場に現れたものと同じ種類だった。\n\n身体には、まだ傷が残っている。\n\n右脚。\n\nナハトが追っていた個体だ。\n\n「当たり」\n\n刀を抜く。\n\nヴォルトも杖を構えた。\n\n星獣が低く唸る。\n\nだが――。\n\n襲ってこない。\n\nナハトも動かなかった。\n\n昨日の光景が頭をよぎる。\n\n広場。自分の前で止まった星獣。あの目。\n\nそして。\n\n胸の奥に浮かんだ、説明のつかない感覚。\n\n――懐かしい。\n\n「……またか」\n\nナハトが呟いた。\n\n「何が？」\n\n「いや」\n\n星獣が一歩、動く。\n\nナハトの指が柄を握り直した。\n\nしかし。\n\n星獣が向かったのは、二人ではなかった。\n\nそのまま横を向く。\n\n森の奥へ。\n\n「……？」\n\nヴォルトが眉をひそめる。\n\nそこで初めて、二人は気づいた。\n\n星獣の向こう。\n\n木漏れ日の落ちる場所に――誰かいる。\n\n少女だった。\n\n森の深い緑の中で、長い赤髪だけが火のように鮮やかだった。髪の一部は後ろでまとめられ、大きな黒いリボンが揺れている。白い服の上には赤いフード付きの短い外套。小柄な身体には少し大きく見える革の鞄を腰に下げていた。\n\n森の中に一人。\n\n武器も持たず。逃げてもいない。\n\n星獣との距離は、ほんの数歩。\n\n「おい！」\n\nナハトが声を上げた。\n\n少女がこちらを見る。\n\n「逃げろ！」\n\nけれど。\n\n少女はきょとんとした。\n\n「どうして？」\n\n「どうしてって――」\n\n星獣が少女へ歩み寄る。\n\nナハトが地面を蹴った。\n\n刀を抜く。\n\n間に入ろうとした、その瞬間。\n\n「大丈夫だよ」\n\n少女が言った。\n\nその声に、星獣が止まった。\n\nナハトも止まる。\n\nヴォルトも。\n\n「……は？」\n\n少女は星獣へ向き直った。\n\n「まだ痛い？」\n\nそっと手を伸ばす。\n\n星獣が頭を下げた。\n\n大きな鼻先が、少女の手に触れる。\n\nナハトの刀が、ゆっくり下がった。\n\n「…………」\n\nヴォルトも黙っている。\n\n少女は星獣の右脚へしゃがみ込んだ。\n\n昨日負った傷。魔法による火傷が残っている。\n\nその傷へ、手を添えた。\n\nナハトは反射的に周囲を見た。\n\n魔法陣はない。\n\n術式の光も。\n\n詠唱もない。\n\n何もない。\n\nなのに。\n\n風が止んだ。\n\n森が、静かになった。\n\n葉が一枚。少女の肩へ落ちる。\n\n次の瞬間。\n\n傷の周囲に生えていた草が、ふわりと揺れた。\n\n光ではない。炎でも、水でもない。\n\nけれど確かに。\n\n何かが動いた。\n\n星獣の傷が、ゆっくりと閉じていく。\n\nヴォルトの目が見開かれた。\n\n「……今、何した？」\n\n少女が振り返る。\n\n「魔法」\n\n「いや、それは……」\n\nヴォルトが言葉に詰まる。\n\n「……まあ、魔法なんだろうけど」\n\n少女が首を傾げる。\n\n「？」\n\n「術式は？」\n\n「じゅつしき？」\n\n沈黙。\n\nヴォルトがナハトを見る。\n\nナハトもヴォルトを見る。\n\n「ヴォルト」\n\n「なんだ」\n\n「俺に聞くなよ」\n\n「聞いてねえよ」\n\n星獣が立ち上がった。\n\n右脚を地面につける。先ほどまでの痛みはないようだった。\n\nそして少女の頬へ鼻先を寄せると、ゆっくり森の奥へ歩いていった。\n\n誰も止めなかった。\n\n木々の向こうへ、その姿が消える。\n\nあとには三人だけが残った。\n\nヴォルトが額を押さえる。\n\n「……情報量が多い」\n\n「同感」\n\nナハトは刀を鞘へ戻した。\n\n「とりあえず」\n\n少女を見る。\n\n「君、誰？」\n\n少女は答えなかった。\n\nじっとナハトを見ている。\n\n「……？」\n\nナハトが自分の服を見る。\n\n何かついているのかと思った。\n\n何もない。\n\n「俺の顔になんかついてる？」\n\n少女は一歩近づいた。\n\nナハトが一歩下がる。\n\n少女がもう一歩。\n\nナハトがまた下がる。\n\n「近い近い」\n\n少女は止まった。\n\nそれでも視線を逸らさない。\n\n顔。目。髪。腰の刀。\n\n一つ一つ確かめるように見ている。\n\nやがて。\n\n少女の目が、わずかに大きくなった。\n\n「……同じ」\n\n「何が？」\n\n少女は答えない。\n\nその顔に、驚きが浮かぶ。\n\n次に、安堵。\n\nそして。\n\nほんの少しだけ、嬉しそうに笑った。\n\n「やっと会えた」\n\nナハトが固まった。\n\n数秒。\n\n森の音だけが流れる。\n\nナハトはゆっくり隣を向いた。\n\n「……ヴォルト」\n\n「なんだ」\n\n「知り合い？」\n\n「お前を見て言ってんだよ」\n\n少女は、まっすぐナハトを見ていた。\n\nその目には迷いがなかった。\n\n「あなたを、ずっと待ってた」\n\nナハトは何も言わなかった。\n\nヴォルトも何も言わない。\n\n木々の遥か上。\n\n葉の隙間から、細い光が落ちていた。"},{"type":"chapter","title":"第三章","sub":"森の魔女","text":""},{"type":"text","text":"「あなたを、ずっと待ってた」\n\n森の中。赤い髪の少女は、まっすぐナハトを見ていた。ナハトも少女を見た。\n\n数秒。\n\n「……人違いです」\n\n即答した。\n\n「違わないよ」\n「いや、違う」\n「どうして？」\n「俺、こういうの分かるから」\n「何が分かるんだよ」\n\n横からヴォルトが突っ込んだ。\n\nナハトは真顔で答える。\n\n「面倒事の匂い」\n「それは俺もしてる」\n「だろ？」\n「お前からな」\n「ひどいな」\n\n少女は二人のやり取りを気にする様子もなく、ナハトをじっと見つめている。\n\nやがて、また一歩近づいた。ナハトが一歩下がる。\n\n「だから近いって」\n「やっぱり似てる」\n「誰に？」\n「昔の人」\n「それなら確実に人違いだな。俺まだそんな歳じゃない」\n「そうじゃなくて」\n\n少女は少し考えた。言葉を探しているらしい。\n\n「おばあちゃんが教えてくれたお話に出てくる人」\n「物語？」\n\nヴォルトが反応した。少女が頷く。\n\n「ずっと昔のお話。星がまだ近かった頃に、みんなを助けた人」\n\nナハトとヴォルトが顔を見合わせる。\n\n「名前は？」\n「知らない」\n「知らないのか」\n「名前は残ってないって、おばあちゃんが言ってた」\n「じゃあ、どうしてこいつだと思う」\n「似てるから」\n「顔が？」\n「うん」\n\nナハトが自分の頬を触った。\n\n「俺、昔から人気あったのか」\n「その解釈でいいのか？」\n「悪い気はしない」\n\n少女は首を傾げる。\n\n「でも、その人はもっと怖い顔してた」\n「人違いです」\n「そこだけ即答すんな」\n\nヴォルトがため息をついた。\n\n「で、待ってたっていうのは？」\n「いつか来るって言われたから」\n「誰に」\n「おばあちゃん」\n\nまた、その名前だった。\n\n「その話も気になるけどな」\n\nヴォルトは少女の後ろを見る。そこには、先ほどまで星獣がいた。\n\n「さっきの」\n「うん？」\n「魔法」\n「魔法？」\n「そう。それ」\n「魔法だよ」\n「それは聞いた」\n\nヴォルトは額を押さえた。\n\n「どうやった？」\n「どうって？」\n「術式は？」\n「じゅつしき？」\n\nまた同じ反応だった。\n\n「……魔法陣」\n少女は首を横に振る。\n「詠唱」\nまた横。\n「導具」\n横。\n「星脈から魔力を引き上げて、回路を組んだんだよな？」\n\n少女の首が止まった。\n\n「……かいろ？」\n\nヴォルトが黙った。ナハトが肩を叩く。\n\n「諦めろ」\n「待て」\n「世の中には分からないこともある」\n「お前が言うと腹立つな」\n\nヴォルトは少女へ向き直った。\n\n「じゃあ、どうやったんだ」\n「こう」\n\n少女は近くの草へ触れる。\n\n「ちょっと待て。それは手順じゃない」\n「手順？」\n「まず何をする」\n「触る」\n「その次」\n「分かる」\n「何が」\n「その子がどうしたいか」\n\nヴォルトが止まった。\n\n「……草が？」\n「うん」\n「どうしたいか？」\n「うん」\n「草が？」\n「さっきも聞いたよ」\n「確認してるんだよ」\n\nナハトが吹き出した。\n\n「笑うな」\n「いや、頑張ってるなと思って」\n「お前も少しは疑問を持て！」\n「魔法使えない俺に聞かれてもねぇ」\n\n「でも」\n\n少女が言った。\n\n「あなたも分かるでしょ？」\n\n少女はナハトを見ていた。ナハトの笑みが、ほんの一瞬止まった。\n\n「……何が？」\n「分からない？」\n「全然」\n\n少女は不思議そうにする。ナハトは笑った。\n\n「残念。人違いだったな」\n「変なの」\n「初対面の人間に言う？」\n「だって変だもん」\n「ヴォルト。この子、失礼だぞ」\n「お前が言うな」\n\n森の奥で鳥が鳴いた。\n\n「あ」\n「どうした？」\n「お茶」\n「お茶？」\n「冷めちゃう」\n\n少女は森の奥へ歩き始め、数歩進んで振り返る。\n\n「来ないの？」\n「……どこに？」\n「家」\n「なんで？」\n「お茶飲むから」\n「俺たちも？」\n「うん」\n\n当然のように言う。\n\n「どうする？」\n「聞くな。お前が決めろ」\n「じゃあ帰る？」\n「調査中だ」\n「じゃあ行く？」\n「最初からそう言え」\n\n二人は少女の後を追った。\n\n「そういえば。君、名前は？」\n「あ」\n\n少女は足を止めた。\n\n「フレア」\n「フレア」\n「うん」\n「俺は――」\n「ナハト」\n\n先に言われた。\n\n「……なんで知ってる？」\n「さっき呼んでた」\n\nヴォルトが笑った。\n\n「残念だったな、運命じゃなくて」\n「別に期待してないよ」\n「ちょっとしてただろ」\n「してない」\n「顔がしてた」\n「お前、森に置いてくぞ」\n「帰り道分かるからどうぞ」\n\nフレアは二人を見比べた。\n\n「仲いいね」\n\n二人同時に答えた。\n\n「普通」\n「腐れ縁」\n\n答えが違った。フレアが笑った。\n\n森の奥へ進むにつれて、道らしい道はなくなった。だがフレアは迷わない。\n\nやがて、木々の間に小さな家が現れた。\n\n石と木で造られた古い家。屋根には苔。軒下には薬草の束。窓辺には見たことのない瓶が並び、煙突から細い煙が上がっている。\n\n「……魔女の家って感じだな」\n「魔女の家だよ」\n「本当に？」\n「うん」\n\nフレアは扉を開けた。\n\n「ただいま」\n\n返事はない。\n\n家の中は、外から見るより広かった。壁一面の棚。本。薬草。瓶。石。乾燥した木の実。何に使うのか分からない骨。\n\n「最後のやつ怖いな」\n「薬」\n「何の？」\n「お腹痛いとき」\n「余計怖い」\n\nヴォルトは本棚へ近づいた。\n\n「……古いな」\n\n魔法に関する本。薬学。植物。星の観測。見たことのない文字で書かれたものまである。\n\n「これ全部、お前の？」\n「おばあちゃんの」\n「その、おばあちゃんって？」\n「魔女」\n「それは分かった」\n「森の魔女」\n「だから、それも分かった」\n\nフレアが考える。\n\n「おばあちゃん」\n「もういい」\n\nナハトが笑った。\n\nやがて、小さな机に三つのカップが並んだ。\n\n「できた」\n\n濃い緑色だった。湯気とともに独特の匂いが漂う。\n\n「……これは？」\n「お茶」\n「俺の知ってるお茶と色が違う」\n「森のお茶」\n「便利な言葉だな」\n\nフレアが先に飲んだ。平気そうだ。\n\n「先どうぞ」\n「いやいや、客人から」\n「お前も客人だろ」\n「年長者を敬う文化があってね」\n「同い年だ」\n「細かいな」\n\n「飲まないの？」\n「飲むよ」\n\nナハトが覚悟を決め、一口。止まった。\n\n「どう？」\n「個性的だね」\n「まずいんだな」\n「お前も飲め」\n\nヴォルトも一口。\n\n「……個性的だな」\n「だろ？」\n\nフレアが嬉しそうに笑う。\n\n「おばあちゃんも同じこと言ってた」\n「本当？」\n「うん。毎回」\n「改善しようとは思わなかった？」\n「おばあちゃんが味覚の方を鍛えろって」\n「強いな、おばあちゃん」\n\nナハトが笑い、それから何気なく聞いた。\n\n「今日は？」\n\nフレアが見る。\n\n「おばあちゃん」\n\n家には三人しかいない。\n\nフレアは少しだけ黙った。\n\n「春に死んだよ」\n\nあまりにも普通の声だった。\n\nナハトの笑みが消えた。ヴォルトもカップを置く。\n\n「……そうか」\n「うん」\n\nフレアは窓の外を見る。\n\n「すごく長く生きたから、もういいんだって」\n「本人が？」\n「うん。最後の日も、お茶がまずいって怒ってた」\n「元気じゃねえか」\n「そのあと死んだ」\n「急だな……」\n\nフレアは笑った。寂しそうではあった。けれど、泣きそうな顔ではなかった。\n\nナハトはそれ以上聞かなかった。代わりに、カップをもう一度口へ運ぶ。\n\nやっぱりまずかった。\n\n「……しかし、ただの森の魔女じゃなさそうだな」\n\nヴォルトは一冊の古びた本を開く。\n\n最初は普通だった。魔力。術式。回路。ヴォルトにも理解できる内容。\n\nだが、途中から変わった。\n\n余白いっぱいに、別の筆跡で書き込みがある。\n\n『術式を介さず』\n\n『対象との――』\n\nそこから先は、インクが滲んで読めない。\n\n次のページには植物の根、人間の身体、星獣らしき生物。それらをいくつもの線が結んでいる。\n\n「なんだ、これ」\n「分かる？」\n「分からん」\n「専門家だろ」\n「だから分からんのがおかしいんだ」\n\nヴォルトはページをめくる。\n\n「少なくとも、普通の魔法理論じゃない」\n\nフレアが覗き込む。\n\n「あ。それ、おばあちゃんがよく読んでた」\n「意味は？」\n「難しいから読んでない」\n「だろうな」\n\nヴォルトの視線が、もう一冊へ向かう。\n\n表紙に文字はない。ただ、円のようなものが描かれ、その中央に小さな星。\n\nヴォルトが手を伸ばす。\n\n「それはダメ」\n\nフレアの声が変わった。\n\n「……ダメ？」\n「うん」\n\nフレアはその本を棚の奥へ戻した。\n\n「おばあちゃんが、誰にも見せちゃダメって」\n「理由は？」\n「知らない」\n\nヴォルトは本を見る。ナハトも見ていた。だが、何も言わなかった。\n\nしばらくして、話は星獣へ戻った。\n\n「あの子たち、最近ずっと落ち着かないの」\n「あの子たち？」\n「星獣」\n「……あれを『あの子たち』って呼ぶ人、初めて見た」\n「そう？」\n「普通は逃げるか討伐するかだな」\n\nフレアの表情が少し曇った。\n\n「どうして？」\n「危険だからだ」\n「でも、何もしなければ襲わないよ」\n「昨日、街に来た」\n「うん」\n「大騒ぎだった」\n「でも人は襲ってないでしょ？」\n\n二人が止まる。\n\n「……お前も知ってたのか？」\n「何を？」\n「街に行ったこと」\n「ううん」\n「じゃあ、なんで」\n「だって、あの子たち、人を食べないよ」\n\nナハトはカップを置いた。ヴォルトも何も言わない。\n\n昨日。確かに星獣たちは人の間を走っていた。\n\nだが、最初に攻撃したのは――。\n\n「最近、ずっと何か探してる」\n「探してる？」\n「うん」\n「何を？」\n「分からない」\n\nフレアは少し考え、ナハトを見る。\n\n「たぶん、あなた」\n\n沈黙。\n\n「ナハト」\n「ん？」\n「今度こそ何か言え」\n\nナハトは少し考えた。\n\n「いやぁ……人気者はつらいね」\n「星獣にモテてどうする」\n「選り好みはよくないだろ」\n「人類でいろ」\n\nフレアが笑った。\n\n「やっぱり、お話の人と違うね」\n「ほら、人違い」\n「でもナハトだと思う」\n「どうして」\n「なんとなく」\n「一番信用できないやつだ」\n「私は信用してるよ」\n\n即答だった。\n\nナハトが一瞬黙る。\n\n「……会って半日も経ってないけど？」\n「うん」\n「俺、悪い奴かもしれないよ？」\n「違うよ」\n「なんで？」\n「星獣を斬らなかったから」\n\nナハトの口が止まった。\n\nフレアはそれ以上何も言わなかった。\n\nヴォルトだけが、ちらりとナハトを見た。\n\n夕方。\n\nナハトとヴォルトは森を出る準備を始めた。\n\n「じゃあな」\n「うん」\n\n二人が歩き出す。\n\n十歩。\n\n後ろから足音。\n\nナハトが止まり、振り返る。\n\nフレアがいる。\n\n「……何してるの？」\n「行く」\n「どこに？」\n「一緒に」\n「誰と？」\n「ナハト」\n「俺？」\n「うん」\n「なんで？」\n「確かめたいから」\n「何を？」\n「お話の続き」\n\nナハトはヴォルトを見る。ヴォルトは空を見る。\n\n「俺を見るな」\n「止めてよ」\n「お前が待たれてたんだろ」\n「他人事だと思って」\n\nナハトはフレアへ向き直った。\n\n「危ないよ」\n「大丈夫」\n「外は星獣より面倒なのがたくさんいる」\n「ナハトとか？」\n「……ヴォルト、この子やっぱり失礼だぞ」\n「相性いいんじゃないか？」\n「よくない」\n\nフレアが言う。\n\n「私、魔法使えるよ」\n\nヴォルトが即答した。\n\n「それが一番不安なんだよ」\n「どうして？」\n「説明できない魔法を自信満々に使うからだよ！」\n「使えるからいいでしょ？」\n「よくない！」\n\nナハトは笑いを堪えていた。\n\n「何笑ってる」\n「いや。頑張れ、専門家」\n「お前の旅だろ！」\n「いつから？」\n「今からだ！」\n\n結局、フレアはついてきた。\n\n正確には、ナハトが許可したわけでも、ヴォルトが納得したわけでもない。\n\nただ歩き始めた二人の後ろを、普通についてきた。\n\nそして、何度追い返しても、ついてきた。\n\n森の出口が見える。\n\n夕陽が木々の向こうから差し込んでいた。\n\nナハトとヴォルトが先に進む。\n\nフレアだけが、ふと足を止めた。\n\n振り返る。\n\n森の奥。木々の影。\n\nそこに、いくつもの目があった。\n\n星獣たち。\n\n遠くから、静かにこちらを見ている。\n\n襲ってこない。唸りもしない。\n\nただ、見ている。\n\nフレアは少しだけ笑った。\n\n「行ってくるね」\n\n返事はなかった。\n\n風が吹く。木々が揺れる。\n\nフレアは前を向いた。\n\n「フレアー？」\n\n遠くからナハトの声。\n\n「置いてくぞー」\n「今行く！」\n\n走り出す。\n\n森を抜ける。\n\nその先で、ナハトとヴォルトが待っていた。\n\n二人だった旅に、一人が増えた。\n\n三人は夕暮れの街道を歩き出した。"},{"type":"chapter","title":"第四章","sub":"三人目の宿代","text":""},{"type":"text","text":"ノルンの城壁が見えた頃には、すっかり日が暮れていた。\n\n門の上には導機灯が並び、淡い白光が石壁を照らしている。そのさらに上、夜空を大きく横切る星環は、昨日と変わらず静かに輝いていた。\n\n「着いた」\n\nフレアが言った。\n\n「街」\n\n「見れば分かる」\n\nヴォルトが答える。\n\n「大きいね」\n\n「感想それだけか」\n\n「大きいし、明るい」\n\n「増えたな」\n\nナハトが笑った。\n\n「まあ、初めてならそんなもんじゃない？」\n\nフレアは返事をしなかった。\n\n門を見ているのかと思ったが、違った。\n\nその視線は、門の脇に立つ一本の柱へ向いていた。\n\n柱の上では、透明な覆いの中に白い光が浮かんでいる。\n\n「……あれ、火じゃない」\n\n「導機灯だな」\n\nヴォルトが言った。\n\n「どうきとう」\n\n「中の導機に術式を組んで、魔力を流して光らせてる」\n\n「ずっと？」\n\n「夜の間はな」\n\nフレアがしばらく見上げる。\n\n「もったいない」\n\n「何が？」\n\n「魔力」\n\nヴォルトが少しだけ目を瞬いた。\n\n「……まあ、そういう考え方もあるか」\n\nナハトは二人の間を通り抜けた。\n\n「はいはい。魔法談義は宿取ってからにしよう。俺はもう腹減った」\n\n「お前、森を出てからそれしか言ってないぞ」\n\n「人間、腹が減ると死ぬからね」\n\n「たぶんもう少し持つ」\n\nフレアが言った。\n\n「どっちの味方？」\n\n「事実」\n\n「この三人、俺に厳しくない？」\n\n「三人？」\n\nフレアが聞き返した。\n\nナハトの足が、一瞬止まった。\n\n「……言葉の綾」\n\nそのまま門へ向かう。\n\nヴォルトは何も言わなかった。\n\nただ、少しだけ笑っていた。"},{"type":"text","text":"星環祭の翌日。\n\nノルンの街は、昨日の騒ぎが嘘だったかのように動いていた。\n\n壊れた露店には新しい板が打ちつけられ、石畳にはまだ爪痕が残っている。広場の一角では職人たちが割れた導機灯を交換していた。\n\nそのすぐ横を、買い物籠を持った女が歩いていく。\n\n子どもたちは走っている。\n\n屋台からは肉を焼く匂いが漂っていた。\n\n「……もう直してる」\n\nフレアが呟いた。\n\nナハトが横目で見る。\n\n「昨日も言ったけど、ここの人たち、こういうの得意だからね」\n\n「直すの？」\n\n「壊れたままじゃ困るだろ」\n\nヴォルトが答えた。\n\n「明日も飯を食わなきゃならないし、店も開けなきゃならない。祭りが終わっても生活は続く」\n\nフレアは少し考えて、\n\n「強いね」\n\nと言った。\n\n今度はヴォルトも突っ込まなかった。\n\n三人は広場を抜け、市場通りへ入った。\n\n夕刻でも店は多い。\n\n果物、乾燥肉、布、薬草、魔導具、食器。\n\n店先の小さな導機が風を送り、吊るされた飾り布を揺らしている。\n\nフレアの足が止まった。\n\n「これ」\n\n薬草店だった。\n\n店先に、小さな葉を束ねたものが並んでいる。\n\n「森にいっぱいある」\n\n「へえ」\n\nナハトが値札を見る。\n\n「大銅貨三枚」\n\nフレアも値札を見る。\n\n葉を見る。\n\nもう一度、値札を見る。\n\n「なんで？」\n\n「なんでって」\n\n「生えてるよ？」\n\n「街には生えてないから売れるんだよ」\n\nヴォルトが言った。\n\n「採りに行く手間、運ぶ手間、傷まないように保存する手間。それ全部込みの値段だ」\n\n「……これが？」\n\n「これが」\n\nフレアの目が細くなる。\n\nナハトは嫌な予感がした。\n\n「ちなみに言っとくけど」\n\n「うん」\n\n「明日森に戻って全部採ってこようとか考えるなよ」\n\n「どうして分かったの？」\n\n「顔」\n\n「そんな顔してた？」\n\n「金のなる草を見つけた顔」\n\nフレアは自分の頬を触った。\n\nヴォルトがため息をつく。\n\n「あと、知らない相手に『森にいっぱいある』って言うな」\n\n「どうして？」\n\n「買い叩かれる」\n\n「かいたたく？」\n\n「安く買われるってこと」\n\n「なんで？」\n\n「……ナハト」\n\n「俺に振るなよ」\n\n「お前の方がこういうの得意だろ」\n\nナハトは少し考えた。\n\n「フレア」\n\n「うん」\n\n「世の中にはね。知らないって顔してると、銀貨一枚のものを大銅貨一枚で買おうとしてくる人がいる」\n\n「悪い人？」\n\n「いい人でもやる」\n\n「なんで？」\n\n「商売だから」\n\n「……街、難しい」\n\n「森よりはね」\n\n「森の方が簡単だよ。食べられるか、食べられないかだから」\n\n「たまに死ぬやつだろ、それ」"},{"type":"text","text":"宿に着いた。\n\n《銀鹿亭》。\n\nナハトとヴォルトがノルンに滞在するとき、よく使っている宿だ。\n\n一階は酒場になっていて、夕食時ということもあり賑わっていた。\n\n受付の女主人がナハトを見る。\n\n「あら。生きて帰ったの」\n\n「ひどい挨拶だなあ」\n\n「昨日あんなことがあったでしょう。あんた、絶対首突っ込んだと思ってたから」\n\n「人聞きの悪い。俺は平和を愛する男ですよ」\n\n「その刀置いてから言いな」\n\n「ごもっとも」\n\n女主人の視線がヴォルトへ移り、その後ろで止まった。\n\n「……増えた？」\n\n「拾った」\n\n「拾われてない」\n\nフレアが言った。\n\n「ついてきた」\n\n「もっと悪いだろ」\n\nヴォルトが言った。\n\n女主人は三人を順番に見た。\n\n「で、部屋は？」\n\n「二部屋」\n\nナハトが即答した。\n\n「俺とこいつで一部屋。彼女に一部屋」\n\n「三人でいいよ」\n\nフレアが言った。\n\n沈黙。\n\nナハトが振り返る。\n\n「よくない」\n\n「どうして？」\n\n「どうしてと言われましても」\n\n「森では一緒に寝るよ？」\n\n「森と街にはそれぞれ法律に書いてないけど守った方がいいことがありまして」\n\n「ナハトが変なことするの？」\n\n「なんで俺が危険人物みたいになってんの？」\n\nヴォルトが顔を背けた。肩が揺れている。\n\n「笑うな」\n\n「いや……自分でどんどん怪しくなってるぞ」\n\n女主人が鍵を二つ取り出した。\n\n「はいはい。二部屋ね」\n\n「助かります」\n\n「一泊、朝食付きで一部屋大銅貨八枚」\n\nフレアが鍵を受け取ろうとして、止まった。\n\n「……お金いるの？」\n\nナハトとヴォルトが同時に彼女を見る。\n\n「いるよ」\n\n「寝るのに？」\n\n「いる」\n\n「森はただだった」\n\n「街は屋根がついてるからね」\n\nフレアが天井を見る。\n\n「屋根、高いんだね」\n\n「そういう意味じゃない」"},{"type":"text","text":"夕食は、一階の酒場で取ることになった。\n\n煮込み肉と黒パン。豆のスープ。焼いた根菜。\n\nフレアは最初こそ珍しそうに見ていたが、一口食べると急に黙った。\n\n二口。三口。\n\n「うまい？」\n\nナハトが聞く。\n\nフレアは頷いた。\n\n「おいしい」\n\n「よかったね」\n\n「もう一個頼んでいい？」\n\n「いいよ」\n\n「ナハトのお金で？」\n\n「ちょっと待とうか」\n\nヴォルトが笑った。\n\n「そろそろ教えた方がいいな」\n\nナハトが懐から革袋を出した。\n\n今日受け取った報酬が入っている。\n\nエルデ森林・星獣追跡調査。\n\n大銀貨八枚。\n\n「今回の報酬」\n\nフレアが覗き込む。\n\n「これが大銀貨」\n\n「そう」\n\n「大銅貨より強い？」\n\n「強いって何」\n\nヴォルトが硬貨を一枚ずつ卓上へ置いた。\n\n銅貨。大銅貨。銀貨。大銀貨。\n\n「銅貨十枚で大銅貨一枚。大銅貨十枚で銀貨一枚。銀貨十枚で大銀貨一枚」\n\n「いっぱいある」\n\n「まだ金貨がある」\n\n「まだあるの？」\n\n「ある」\n\nフレアはしばらく硬貨を見つめた。\n\nそして、\n\n「森って安かったんだね」\n\nナハトが吹き出した。\n\n「その感想は好きだな」\n\n報酬から、依頼中の経費を引く。宿代。食費。消耗品。\n\n残った分を、ナハトが二つに分けようとした。その手が止まる。\n\nフレアが見ている。\n\n「……何」\n\n「私は？」\n\n「今回の依頼、受けたときはいなかったでしょ」\n\n「星獣、見つけたよ」\n\n「俺たちがね」\n\n「治した」\n\n「……それ言われると弱いな」\n\nヴォルトが硬貨を一枚、フレアの前へ滑らせた。\n\n「協力分」\n\n大銀貨一枚。\n\nフレアがそれを摘まむ。\n\n「これ、私の？」\n\n「そう」\n\n「何に使ってもいい？」\n\n「犯罪以外なら」\n\n「じゃあ――」\n\nフレアが立ち上がった。\n\nナハトが嫌な予感を覚えた。\n\n数分後。彼女は追加の料理を抱えて戻ってきた。\n\n「買ってきた」\n\n「初めて自分で稼いだ金の使い道が飯」\n\nナハトが言う。\n\nフレアは椅子に座った。\n\n「ナハトも食べていいよ」\n\n「……いい子だなあ」\n\n「ちょろいぞ、お前」"},{"type":"text","text":"夜。ナハトとヴォルトの部屋。\n\nナハトは寝台に腰掛け、刀を膝に載せていた。鞘から抜き、布で刃についた汚れを拭っていく。星獣の爪を何度も受けたはずなのに、刀には刃こぼれひとつない。\n\n向かいでは、ヴォルトが机に紙を広げていた。\n\n「報告、どうする」\n\n「見たままでいいんじゃない？」\n\n「術式なしの治療も？」\n\n刃を拭いていた手が止まった。\n\n「それはなし」\n\n「だよな」\n\nあっさり同意した。\n\nナハトが顔を上げる。\n\n「意外」\n\n「俺にも説明できないものを報告書に書いてどうする」\n\nヴォルトはペンを走らせる。\n\n「星獣一体を確認。祭りで負傷した個体と推定。積極的な攻撃行動は確認できず――」\n\n少し止まる。\n\n「……これも書くか」\n\n「何？」\n\n「人を避けて移動した形跡」\n\nナハトは答えなかった。\n\n森の中。折られていなかった枝。踏まれていなかった白い花。そして、自分の前で止まった星獣。\n\n「見たことは書いとけば？」\n\n「珍しく真面目だな」\n\n「いつも真面目ですよ」\n\n「はいはい」\n\nペンが再び動く。\n\nしばらく、紙を擦る音だけがした。\n\nやがてナハトが言った。\n\n「ヴォルト」\n\n「ん？」\n\n「フレア、どうする？」\n\nペンが止まった。\n\n「お前についてきたんだろ」\n\n「そうなんだよねえ」\n\n「嫌なら言えばいい」\n\n「別に嫌じゃない」\n\n即答だった。\n\n自分でも少し早かったと思ったのか、ナハトは刀を鞘へ戻した。\n\n「ただ、ほら。俺たち別に観光してるわけじゃないし」\n\n「傭兵二人について歩く方が、森に一人でいるより安全かは微妙だな」\n\n「でしょ？」\n\n扉が叩かれた。\n\n二人がそちらを見る。\n\n「開いてるよ」\n\nフレアが入ってきた。手に三つの木杯を持っている。湯気が立っていた。\n\n「お茶」\n\nナハトとヴォルトが黙った。\n\n「……どうしたの？」\n\n「いや」\n\nナハトが笑う。\n\n「ちょうど君の今後について話してたところ」\n\nフレアは木杯を置いた。\n\n「行くよ」\n\n「まだ何も聞いてないけど」\n\n「二人と」\n\n「だから」\n\n「だめ？」\n\nまっすぐだった。\n\nナハトはこういう目が苦手だ。冗談が入り込む隙間がない。\n\nだから木杯を手に取った。\n\n「まあ、働いてもらうけどね」\n\n「働く」\n\n「飯代も」\n\n「払う」\n\n「宿代も」\n\n「屋根代」\n\n「そうそう、屋根代」\n\nヴォルトが口を挟む。\n\n「お前、適当なこと教えるな」\n\nフレアは頷いた。\n\n「分かった」\n\n「分かってないだろ」\n\nナハトが茶を一口飲んだ。止まった。\n\nヴォルトがその顔を見る。\n\n「……どうした？」\n\nナハトは静かに木杯を置いた。\n\n「フレア」\n\n「うん」\n\n「これ、何？」\n\n「お茶」\n\n「何を入れた？」\n\n「葉っぱ」\n\n「それは知ってる」\n\nヴォルトも恐る恐る飲む。\n\n沈黙。\n\n「……苦いな」\n\n「でしょ？」\n\n「お前なんで嬉しそうなんだ」\n\nフレアは自分の分を飲んだ。平然としている。\n\n「おばあちゃんも、まずいって言ってた」\n\n「改善しようとは思わなかった？」\n\n「したよ」\n\n「これで？」\n\n「昨日よりおいしい」\n\nナハトとヴォルトは顔を見合わせた。\n\n「ヴォルト」\n\n「なんだ」\n\n「明日も生きてたら仕事探そう」\n\n「そこまでじゃない」\n\n「失礼だね」\n\nフレアが少しだけ頬を膨らませた。\n\nその夜。銀鹿亭の二階に、部屋が二つ取られた。\n\n片方に二人。片方に一人。\n\nまだ、それだけだった。\n\n三人組と呼ぶには、少し早い。\n\nけれど翌朝。\n\n朝食の卓には最初から椅子が三つ並んでいた。"},{"type":"chapter","title":"第五章","sub":"空飛ぶ商隊","text":""},{"type":"text","text":"翌朝。銀鹿亭の一階に降りると、本当に椅子が三つあった。\n\n「どうした？」\n「いや。宿のおばちゃん、仕事が早いなと思って」\n\n窓際では、すでにフレアがパンを食べていた。\n\n「パンは？」\n「食べた」\n「早くない？」\n「おいしかった」\n\n女主人が「追加なら大銅貨二枚ね」と言うと、フレアは昨日もらった大銀貨をそのまま出そうとした。ナハトが慌てて手首を掴む。\n\n「朝飯に大銀貨出す人、初めて見た」\n「これしか持ってない」\n「両替してもらいなさい」\n「りょうがえ」\n「今日も勉強だねえ」\n\n朝食後、三人は《渡り鳥の止まり木》で仕事を探した。街道警備、荷運び、薬草採取、害獣駆除、家畜探し。\n\n「これ」\nフレアが《鶏十二羽・捜索》を指差す。\n「やらない」\n「なんで？」\n「三人の旅の始まりが鶏探しなの、嫌じゃない？」\n「仕事を選ぶな」\n「じゃあヴォルトやる？」\n「……ほかを見よう」\n「選んでるじゃん」\n\n受付から声が飛んだ。今日出る商隊の護衛。南街道を通ってリュネまで二泊三日、一人につき大銀貨二枚。\n\n「受けます」\n「早いな」\n\nハルバ商会。浮遊荷車六台、客車二台。護衛八人。\n\n「浮遊？」\n\n南門の外で、フレアは口を開けた。\n\n「浮いてる」\n「浮いてるね」\n「浮いてる」\n「二回言った」\n\n巨大な荷車には車輪がなく、荷台の下で青白い術式光が規則正しく明滅していた。地面との隙間は手のひら二つ分ほど。\n\n「空、飛ぶんじゃなかったの？」\n「浮いてるだろ」\n「ちょっとだけ」\n「期待させる名前だよねえ」\n\nヴォルトは導機を覗き込み、「四点支持か。後部だけ補助回路が別になってる」と夢中になる。\n\n「始まった」\n「なにが？」\n「放っとくと長いよ」\n「聞こえてるぞ」\n\n商隊長バルドの説明を受け、商隊は出発した。浮遊荷車は車輪の音もなく滑るように進む。先頭の馬は操舵と補助を担う。\n\n「全部魔法で動かせばいいのに」\n「できる」\n「じゃあ、なんで？」\n「高い」\n\nヴォルトは、魔力も導機も維持費がかかり、馬には馬の便利さがあると説明する。\n\n街道には徒歩の旅人もいた。大荷物を背負う男、子どもの手を引く母親、杖をついた老人。客車の窓の向こうでは、上等な服の少女が柔らかな座席で果物を食べている。\n\n「歩かない人もいるんだね」\n「金を払えばね」\n「高い？」\n「人による」\n\n昼の休憩所。旅人も商隊も同じ水場を使うが、客には使用人が水を運ぶ。\n\n「同じ道なのに」\n「持ってるものが違うから」\n「お金？」\n「それも。家だったり、仕事だったり、生まれだったり。いろいろ」\n\nフレアは言った。\n「森では、強い木はたくさん光を取るよ。小さい木は、その下で生きる。でも大きい木が倒れたら、小さい木に光が当たる」\n\nナハトが笑う。\n「怖いこと言うね」\n「？」\n\n午後、三台目の荷車が大きく傾いた。右後部の浮遊回路が落ち、ヴォルトが荷車の下へ潜り込む。原因は冷却槽の水不足だった。\n\n「水ならあるよ」\n\nフレアは街道脇の草へ触れ、斜面の向こうへ進む。そこには地面から染み出す細い流れがあった。\n\n「よく見つけたな」\n「音するよ」\n\nナハトには聞こえなかった。\n\n水を運び、ヴォルトが壊れた管を外す。\n\n「魔法なの？」\n「導機」\n「魔法と違う？」\n「魔法を機械にやらせてる」\n「なんで？」\n「人間より正確だから」\n「ヴォルトより？」\n「……場合による」\n\n一時間後、青白い光が戻り、荷台が持ち上がった。\n\n「すごい」\n「まあな」\n「魔法使わなかった」\n「使ってる」\n「使ってないよ」\n「……この話、長くなりそうだな」\n\nその夜、宿場町。護衛用の大部屋には八つの寝台が並んだ。\n\n「今回は三人で？」\n「今回は仕事だから仕方ない」\n「街の決まりは？」\n「仕事には負ける」\n「街、難しい」\n\n食後、宿の外でナハトとフレアは星環を見上げた。小さな祠では商隊の老人が旅の安全を祈っている。\n\n「みんな、あれに祈るね」\n「旅人は特に」\n「ナハトも？」\n「どうだろ」\n「ヴォルトは、困ったときだけって」\n「らしいね」\n\nフレアは星環を見上げた。\n「きれいだね」\n「うん」\n\n今度はナハトも茶化さなかった。\n\n窓からヴォルトの声が飛ぶ。\n「明日早いって言っただろ！」\n「お母さんが呼んでるよ」\n「誰がお母さんだ！」\n\n暗くなった大部屋で、フレアが聞く。\n「ナハト。屋根代、今日は？」\n「依頼主持ち」\n「ただ？」\n「ただ」\n「仕事っていいね」\n「その理解の仕方で大丈夫か？」\n\n三人で受けた最初の仕事は、まだ半分も終わっていなかった。"},{"type":"chapter","title":"第六章","sub":"炎の収穫祭","text":""},{"type":"text","text":"三日目の夕刻。ハルバ商会の旗が、リュネの門をくぐった。\n\n「着いたあ！」\n「元気だねえ」\n「ナハトもやれば？」\n「大人にはね、やっていいことと悪いことがあるんですよ」\n「昨日、宿で枕投げてた人が何言ってんだ」\n\n報酬は大銀貨二枚ずつ。フレアは「今度は使い方分かる」と胸を張り、「大銅貨にする。それでパンを買う」と答えた。\n\n次の目的地は、ひとまずレグルス。ヴォルトが導機を学んだ大きな街だ。\n\n翌日、三人はリュネを出た。そして昼過ぎ、道を間違えた。\n\n「迷った？」\n「迷ってない」\n「迷ってる」\n\n遠くから麦を満載した荷車が来た。子どもたちが叫ぶ。\n「どこ行くのー！」\n「レグルスー！」\n「逆ー！」\n\nヴォルトがゆっくりナハトを見る。\n「ほら。早めに気づけてよかった」\n「お前な」\n\n荷車について着いたのは、黄金色の麦畑に囲まれた農村アウレ。村の中央には家二階分ほどの巨大な麦藁人形が立っていた。\n\n「巨人？」\n「違うよ！　麦守り様！」\n「今夜、燃やすんだ！」\n「せっかく作ったのに？」\n「だから燃やすんだよ！」\n\n旅人と知った村の老人は、今夜は収穫祭だから泊まっていけと言った。\n\n「宿代は？」\n「祭りの日にそんなもん取るか」\n\nナハトとフレアが顔を見合わせる。\n「屋根、ただ？」\n「ただ」\n「すごい」\n\n村には導機灯がほとんどない。家々には油灯。大きな水車と木製の水路が畑へ水を運び、水路の途中では古い揚水術式が水を高い畑へ持ち上げていた。\n\n「古い揚水術式だな。循環と干渉を組み合わせてる」\n\nヴォルトの説明を聞いた農夫が、調子の悪い設備を見てくれと言う。原因は魔法ではなく水路の泥だった。\n\n「魔法じゃなかったね」\n「導機が壊れたと思ったら、まず詰まりを疑え」\n\nその後フレアは薬草を選別する村の女たちに捕まり、食べられる草、薬になる草、ただ苦い草を次々に見分けていく。\n\n「馴染んでるな」\n「森じゃあいつの方が先生だからな」\n\n夕暮れ。村中に肉、魚、パン、豆、麦粥、果物、酒の匂いが広がった。長い卓が並び、笛と太鼓と弦楽器が鳴る。\n\n村人たちが麦守り様を囲んで踊り始める。フレアもすぐ輪へ入り、やがてナハトとヴォルトまで引っ張り込まれた。\n\n「ナハト、違う！」\n「知ってる！」\n「逆！」\n「分かってる！」\n「踏んだ！」\n「ごめんヴォルト！」\n「俺の足はそっちじゃない！」\n\n夜。村長が麦守り様の前に立つ。\n\n「今年も、この地に水がありました。土がありました。光がありました。我らが種を蒔き、育て、刈り取る日まで――今年も星環の光は、我らの上にありました」\n\n村の術師が手を掲げ、淡い術式が浮かぶ。炎が麦藁を駆け上がった。巨大な麦守り様が燃え、火の粉が星環の下へ舞う。\n\n村人たちは古い歌を歌った。子どもも老人も農夫も術師も。\n\n「きれい」\n「うん」\n「星環祭と違う。でも、どっちも好き」\n「それでいいんじゃない？」\n\nフレアは村人と同じように手を合わせる。\n「今年も、おいしいものが食べられますように」\n「それ、来年のお願いじゃない？」\n\n考え直して、もう一度目を閉じる。\n「じゃあ、おいしかったです」\n「神様への報告が雑だなあ」\n「星環だよ」\n「そうでした」\n\n夜、三人は村外れの納屋で藁の上に毛布を敷いた。\n\n「屋根、ただだった」\n「気に入りすぎでしょ、その概念」\n「夕飯もただ」\n「ヴォルトが水路直したからね」\n「私も薬草分けた」\n「俺は？」\n\n沈黙。\n\n「踊った」\n「報酬出る？」\n「出ない」\n「世知辛い」\n\n遠くから祭りの歌が聞こえる。\n\n「ねえ。旅って、いつもこうなの？」\n「いや。もっと面倒なこともあるし、雨も降るし、飯がまずい日もあるし」\n「ナハト。お前の隣に、まずい茶を淹れる本人がいる」\n「……寝た？」\n「起きてる」\n「ごめんなさい」\n「明日も淹れる」\n「強い」\n\n静かになる。\n\n「でも、楽しいね」\n\n今度は誰も茶化さなかった。\n\n「まあね」\n\n炎は夜更けまで燃えていた。麦畑の向こうでは、星環がいつもと変わらず白く輝いていた。"},{"type":"chapter","title":"第七章","sub":"魔法が使えない日","text":""},{"type":"text","text":"「……暗くない？」\n「暗いね」\n「暗いな」\n\n三人は並んで街を見上げていた。時刻は昼過ぎ。空は晴れ、太陽も出ている。それでも暗く見えた。\n\n「導機灯が全部消えてるからだ」\n\n農村アウレを出て二日。三人がたどり着いた城塞都市カルディアでは、年に一度の《休律日》を迎えていた。\n\n大通りの導機車、導機灯、揚水導機、工房の大型導機。公共導機がすべて止まり、普段機械が担う仕事を人間がやっている。\n\n市場では魚屋が氷を抱えて走る。\n「どけどけどけ！　溶ける！」\n\n向かいの大商店からは冷気が漏れていた。\n「あそこ、動いてる」\n「あれは私設導機だ。自前の魔力槽と回路を持ってる店までは止まらない」\n「ずるい」\n「金持ちは便利を買えるんだよ」\n\n少し先の小さな魚屋では、主人が必死に氷を砕いていた。\n\n鐘が鳴り、子どもたちが学校から出てくる。市立の術学院だった。中庭では教師が黒板に術式を書いている。\n\n「観測を先に。結果を予測してから循環を組む。順番を飛ばすな」\n\n生徒が水を浮かせようとして失敗する。笑い声に教師が「笑わない！　最初からできる者などいない。もう一度！」と叱る。二度目、水は浮いた。\n\n「できた！」\n\nフレアが笑う。\n「みんな、同じことするんだね」\n「基礎だからな」\n「魔法なのに？」\n「魔法だからだよ」\n\n宿は休律日の技師や職人で満室。四軒目でようやく屋根裏を借りられた。\n\n「三人で？」\n「今日は例外」\n「街の決まりは？」\n「屋根には勝てない」\n「前も仕事に負けてた」\n「世の中には優先順位というものがあるんですよ」\n\n荷物を置くと、ヴォルトは工房街へ向かった。街路の金属板が開けられ、普段は見えない地下の魔力幹線が露出している。石工、導機技師、術師、配管工、人夫が同じ穴を囲んで働いていた。\n\n「街の下、こんなになってるんだ」\n「水路と一緒だ。魔力を運ぶ幹線があって、そこから各区画へ分ける」\n「血管みたい」\n「……悪くない例えだな」\n\n「魔法使いだけじゃないんだね」\n「術式が正しくても、管が割れれば水は来ない。導機が動いても、土台が崩れれば使えない」\n「世の中、一人じゃ何もできないねえ」\n「お前が言うと説得力あるな」\n\n午後、三人は丘の上の富裕区へ入る。そこでは庭の噴水も導機灯も動き、導機車まで走っていた。\n\n「ここは休律日じゃないの？」\n「同じカルディアだよ」\n\n坂の下には、水を運ぶ人々と止まった共同設備。丘の上には静かに動く私設導機。\n\n「同じ街なのに」\n「同じ街だからって、同じ暮らしができるわけじゃない」\n「なんで？」\n\n生まれ、仕事、家、商売、土地、人とのつながり、運。ヴォルトは最後に「いろいろだ」と答えた。\n\n「変なの。下の人も水ほしいでしょ。上の人はいっぱいある。じゃあ、分ければいいのに」\n「それが簡単だったら、世の中もっと楽なんだけどね」\n\n帰り道の下町では、若者たちが大きな樽を荷車に載せて水を配っていた。\n「一軒一杯！　年寄りんとこ優先！」\n「うち後でいいよ！」\n「ばあちゃんとこ持ってって！」\n\n共同炊事導機の代わりに大鍋が火にかけられ、何軒もの家族が一緒に料理している。\n\n「食べてくかい？」\n「いいの？」\n「余ってるからね」\n\nナハトが鍋を覗く。\n「俺もいいですか？」\n「あんたは大銅貨一枚」\n「なんで？」\n「食べそうだから」\n「見る目あるなあ」\n\nフレアは煮込みを食べながら言う。\n「こっちは楽しそう」\n「さっきと言ってること違わない？」\n「水ないのは困る。でも、みんなでご飯食べてる」\n\nヴォルトが言う。\n「不便だから不幸ってわけでもない」\n「便利だから幸せでもない？」\n「……そこまでは言ってない」\n「難しいね」\n「だから場合によるんだよ」\n「出た」\n\n夕刻、鐘が三度鳴った。丘の上の塔が白く光り、そこから一本、また一本と大通りの導機灯が灯っていく。市場、工房、橋、広場。噴水が上がり、揚水機が動き、歓声が起こる。\n\n「すごい」\n「だろ？」\n「ヴォルトがやったの？」\n「違う」\n「じゃあなんで自慢そうなの？」\n「いいだろ別に」\n\nその夜、三人は屋根裏で並んで横になった。\n\n「魔法って、便利だね」\n「今さらだな」\n「森ではなくても困らなかったから。でも、なくてもみんな生きてた」\n「一日だけだからな。毎日止まったら困る。だから点検する」\n「大事なんだね」\n「大事だよ」\n\nナハトが言う。\n「いい仕事してるじゃん、導機術師」\n「急になんだ」\n「褒めた」\n「気持ち悪い」\n「ひどい」\n\n窓の外。街の中心に大きな星環教会の尖塔があり、その周囲に色とりどりの旗が飾られている。\n\n「あれ、何？」\n「ああ。婚礼じゃないか？」\n「こんれい？」\n「結婚式」\n\nフレアが振り返った。\n「見たい」\n「いや、他人の結婚式だからね？」\n「見たい」\n「入れないよ」\n「見たい」\n\nナハトがヴォルトを見る。\n「これ明日、出発できる？」\n「……嫌な予感がする」\n\n夜のカルディア。白く輝く星環の下、教会の尖塔から祝福を告げる鐘が鳴った。"},{"type":"chapter","title":"第八章","sub":"星環の花嫁","text":""},{"type":"text","text":"「見えない」\n「諦めよう」\n「見えない」\n「二回言っても見えないものは見えないよ」\n\n翌朝。カルディア中央区。星環教会前の大通りは人で埋め尽くされていた。色鮮やかな旗、花飾り、屋台、楽師。その向こうに白い大聖堂がそびえる。\n\n「ナハト。肩」\n「嫌です」\n「まだ何も言ってない」\n「言わなくても分かります」\n\n今日の婚礼は、地方の大商会の跡取りと地方貴族の娘。教会で式を挙げ、その後馬車で大通りを巡る。\n\n「貴族と商人って結婚するんだ」\n「するよ」\n「好きだから？」\n「そういうこともある」\n「違うこともある？」\n「あるねえ」\n\n家と家、商売、土地、立場。ヴォルトの説明に、フレアは「街の結婚、難しい」と唸る。\n\n鐘が鳴り、大聖堂の扉が開いた。しかし人垣で何も見えない。そこへ花籠を抱えた若い男がナハトにぶつかり、祝花を撒いてしまう。\n\n「手伝ってください！」\n「なんで？」\n「今、目が合いました！」\n「理由が弱い」\n\n数分後。三人は花籠を抱え、婚礼の手伝いとして教会の裏口から中へ入っていた。\n\n「なんでこうなった」\n「見れる」\n「よかったな」\n\n白い床、色硝子、銀の星環飾り。その廊下で女性の声がした。\n\n「そこの花、こちらへお願いします」\n\n腰まで流れる淡い銀青の髪は、細い編み込みを交えて後ろで上品にまとめられていた。深い青の瞳。白と濃紺を重ねた礼装は華美ではないが、布地も仕立ても、ひと目で上等だと分かる。胸元には青い石と、小さな星環の飾り。\n\n立ち姿まで妙に整っている。\n\n「……あら」\n「これはこれは。運命ですかね」\n「偶然です」\n「即答」\n\nセレナ・アクアレイだった。\n\nフレアとセレナは互いを見つめる。\n「きれい」\n「……ありがとうございます」\n「服もきれい」\n「ありがとうございます」\n「髪も」\n「フレア。全部褒めなくていいから」\n「本当だよ？」\n\nセレナは笑い、「あなたも、とても綺麗な髪ですね」と返した。\n\nセレナは婚家の娘と面識があり、教会の手伝いに来ていた。アクアレイ家は教会の施療院を長く支援しているという。\n\n「お金ない人も？」\n「ええ。すべてではありませんが、払えない方から無理に取ることはありません」\n「フレア。好きそうな制度だよ」\n「好き」\n\n中庭では、教会で暮らす子どもたちが遊んでいた。\n「家は？」\n「ここが家です」\n\n一人が転ぶと、別の子が手を差し出す。フレアは「楽しそう」と言った。\n\n「ええ。そうであってほしいと思っています」\n\n三人は聖堂の端から婚礼を見ることを許された。高い天井、巨大な円環の意匠。高窓から本物の星環の光が差し込む。\n\n祭司の声が響く。\n\n「人は、一人で生まれます。けれど、一人で生きるものではありません」\n\n「異なる道を歩んだ二人が、今日ここで、一つの道を選びます」\n\n「星環が空を巡り、世界を包むように。互いを縛るためではなく、互いが帰る場所となるために」\n\n「喜びの日も。悲しみの日も。豊かな日も。乏しき日も。その人の隣に立つことを、今日、自ら選びなさい」\n\n花嫁と花婿が「はい」と答え、鐘と拍手が響いた。\n\n「気に入った？」\n「うん」\n「結婚したくなった？」\n「ナハトと？」\n\nナハトの拍手が止まり、ヴォルトが咳き込む。\n\n「……なんで俺？」\n「今、ナハトが聞いたから」\n「一般論として聞いたの」\n「一般論？」\n「もういいです」\n\n少し離れたところでセレナが口元を押さえていた。\n\n式が終わり、大聖堂の扉が開く。\n「花！」\n\nフレアが大量の花を掴んで投げる。白い花は花嫁ではなくナハトへ降り注いだ。\n\n「……俺、結婚するの？」\n「おめでとう」\n「誰と？」\n\n次はヴォルトへ。さらにセレナまで一輪拾う。\n\n「セレナさん？」\n「何でしょう」\n「まさか」\n「まさか」\n\nぽい。花がナハトの頭に乗った。\n\n「貴族ってこういうことする？」\n「貴族も人間ですから」\n\n婚礼の馬車が大通りへ出る。人々が手を振り、窓から花が降る。\n\n「みんな知らない人なのに、なんでお祝いするの？」\n\nセレナは答えた。\n「幸せなことは、分けても減らないからではないでしょうか」\n\n「いいね、それ」\n「ありがとうございます」\n「俺が言ったことにしない？」\n「だめ」\n\n午後、教会の食堂。婚礼で余った料理の一部が孤児院と施療院へ回され、子どもたちが喜んでいた。\n\n「結婚式ってすごい。毎日誰か結婚すればいいのに」\n「教会が破産します」\n\nフレアはセレナが明日屋敷へ戻ると聞き、少し残念そうにする。\n\n「また会えますよ」\n「いつ？」\n\nセレナは困り、ナハトが「普通はそこで具体的な日を聞かないの。社交辞令が死ぬから」と言う。\n\nセレナは少し考えた。\n「では、社交辞令にしません。また会いましょう」\n「うん」\n\n夕方、三人は教会を出る。\n\n「では、お気をつけて」\n「セレナも」\n「じゃあ、また運命があれば」\n「偶然で十分です」\n「手厳しい」\n\nその夜。安い食堂の卓で、フレアの皿の横には教会でもらった白い花が一輪置かれていた。\n\n「それ持って帰るの？」\n「うん」\n「枯れるよ」\n「乾かす」\n「何にする？」\n「思い出」\n\nヴォルトが地図を広げる。明日は北東街道へ出る。レグルスまではまだ先だ。\n\n会計へ向かうと、店の主人が聞いた。\n「朝飯もつけるなら先払いだ。何人分？」\n\nナハトは財布を取り出した。\n\n「三人」\n\n答えはすぐに出た。\n\n「朝早いから、包んでもらえる？」\n「あいよ。三人分な」\n\n誰も何も言わなかった。ナハト自身も気づいていなかった。\n\n少し前なら、一度数えていた。\n\n二人と一人。\n\n今はもう。\n\n三人だった。\n\n翌朝。カルディアの門が開く。三つの影が街道へ伸びる。\n\nナハト。ヴォルト。フレア。\n\n遠くには山。その先に、まだ見ぬ町。さらにその先、導機と魔法研究の都市レグルス。\n\n「行くか」\n「うん」\n「今度こそ道、間違えるなよ」\n「信用ないねえ」\n「地図貸して」\n「なんで？」\n「私が持つ」\n「フレアにまで！？」\n\n朝の街道に、笑い声が響いた。\n\n三人の旅は、まだ始まったばかりだった。"}];
let pages=[],index=0;
const READING_KEY="seikan_story_v1_reading_position";
function pageAnchor(i){
 const d=pages[i];
 if(!d)return null;
 if(d.type==="text"||d.type==="quote")return {type:d.type,anchor:(d.text||"").replace(/\s+/g,"").slice(0,80),ratio:pages.length>1?i/(pages.length-1):0};
 return {type:d.type,title:d.title||"",sub:d.sub||"",ratio:pages.length>1?i/(pages.length-1):0};
}
function savePosition(){
 try{localStorage.setItem(READING_KEY,JSON.stringify(pageAnchor(index)))}catch(e){}
}
function restorePosition(){
 try{
  const raw=localStorage.getItem(READING_KEY); if(!raw)return 0;
  const p=JSON.parse(raw);
  if(p.anchor){
   const j=pages.findIndex(d=>(d.type==="text"||d.type==="quote")&&(d.text||"").replace(/\s+/g,"").includes(p.anchor));
   if(j>=0)return j;
  }
  if(p.title){const j=pages.findIndex(d=>d.type===p.type&&d.title===p.title&&d.sub===p.sub);if(j>=0)return j;}
  if(Number.isFinite(p.ratio))return Math.max(0,Math.min(pages.length-1,Math.round(p.ratio*(pages.length-1))));
 }catch(e){}
 return 0;
}
const stage=document.getElementById("stage"),hud=document.getElementById("hud"),curl=document.getElementById("curl"),measure=document.getElementById("measure"),pageSlider=document.getElementById("pageSlider"),pageJump=document.getElementById("pageJump");

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function paraHTML(x){return `<p class="${x.startsWith("「")||x.startsWith("『")?"dialogue":""}">${esc(x).replace(/\n/g,"<br>")}</p>`}
function bodyHTML(paras,quote=false){return `<div class="inner"><div class="vertical${quote?" quoteText":""}">${paras.map(paraHTML).join("")}</div></div>`}

function setupMeasure(quote=false){
 const probe=document.createElement("section");probe.className="page"+(quote?" quote":"");
 probe.style.position="relative";probe.style.inset="auto";probe.style.margin="0";
 probe.style.width=Math.min(innerWidth,720)+"px";
 probe.style.height=Math.min(innerHeight,980)+"px";
 probe.innerHTML=bodyHTML([],quote);
 measure.innerHTML="";measure.appendChild(probe);
 return probe.querySelector(".vertical");
}
function fits(v){
 return v.scrollWidth<=v.clientWidth+1 && v.scrollHeight<=v.clientHeight+1;
}
function splitTextPage(text,quote=false){
 const original=text.split(/\n\n+/);
 const out=[];let current=[];
 const v=setupMeasure(quote);
 for(const para of original){
   current.push(para);v.innerHTML=current.map(paraHTML).join("");
   if(!fits(v)){
     current.pop();
     if(current.length){out.push(current.slice());current=[]}
     // If one paragraph itself is too large, split safely by characters.
     current=[para];v.innerHTML=current.map(paraHTML).join("");
     if(!fits(v)){
       current=[];let chunk="";
       for(const ch of para){
         const test=chunk+ch;v.innerHTML=paraHTML(test);
         if(!fits(v) && chunk){out.push([chunk]);chunk=ch}
         else chunk=test;
       }
       if(chunk)current=[chunk];
     }
   }
 }
 if(current.length)out.push(current);
 return out.map(ps=>({type:quote?"quote":"text",text:ps.join("\n\n")}));
}
function paginate(){
 pages=[];
 for(const d of sourcePages){
   if(d.type==="cover"||d.type==="chapter")pages.push({...d});
   else pages.push(...splitTextPage(d.text,d.type==="quote"));
 }
 // Content-integrity check: ignore page-boundary paragraph separators only.
 const src=sourcePages.filter(d=>d.text).map(d=>d.text.replace(/\s+/g,"")).join("");
 const dst=pages.filter(d=>d.text).map(d=>d.text.replace(/\s+/g,"")).join("");
 window.__FULL_TEXT_OK__=(src===dst);
 if(!window.__FULL_TEXT_OK__) throw new Error("本文照合エラー");
}
function make(i,cls){
 const d=pages[i],el=document.createElement("section");el.className="page "+cls+(d.type==="quote"?" quote":"");
 if(d.type==="cover")el.innerHTML=`<div class="inner cover"><div class="v"><h1>${esc(d.title)}</h1><div class="sub">${esc(d.sub)}</div></div></div>`;
 else if(d.type==="chapter")el.innerHTML=`<div class="inner chapter"><div class="v"><h2>${esc(d.title)}</h2><div class="sub">${esc(d.sub)}</div></div></div>`;
 else el.innerHTML=bodyHTML(d.text.split(/\n\n+/),d.type==="quote");
 return el;
}
function render(){
 [...stage.querySelectorAll(".page")].forEach(x=>x.remove());
 if(index<pages.length-1){const n=make(index+1,"next");n.style.zIndex=1;stage.insertBefore(n,curl)}
 const c=make(index,"current");c.style.zIndex=3;stage.insertBefore(c,curl);
 hud.textContent=`${index+1} / ${pages.length}`;
 pageSlider.max=pages.length; pageSlider.value=index+1; pageJump.textContent=`${index+1} / ${pages.length}`;
 curl.style.display="none";
 savePosition();
}
function boot(){
 paginate();index=restorePosition();render();
 document.getElementById("hint").textContent=window.__FULL_TEXT_OK__?"全文照合OK　右へスワイプ → 次のページ":"本文照合エラー";
 setTimeout(()=>document.getElementById("hint").style.opacity="0",4200);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")savePosition()});
window.addEventListener("pagehide",savePosition);
window.addEventListener("error",e=>{const h=document.getElementById("hint");if(h){h.textContent="表示エラー："+(e.message||"読み込みに失敗しました");h.style.opacity="1"}});
requestAnimationFrame(()=>requestAnimationFrame(boot));
pageSlider.addEventListener("input",()=>{index=Math.max(0,Math.min(pages.length-1,Number(pageSlider.value)-1));render()});
pageSlider.addEventListener("touchstart",e=>e.stopPropagation(),{passive:true});
pageSlider.addEventListener("touchmove",e=>e.stopPropagation(),{passive:true});
pageSlider.addEventListener("touchend",e=>e.stopPropagation(),{passive:true});


let sx=0,sy=0,drag=false,axis=false,cur=null;
function begin(x,y){sx=x;sy=y;drag=true;axis=false;cur=stage.querySelector(".current");if(cur)cur.style.transition="none"}
function move(x,y){
 if(!drag||!cur)return;const dx=x-sx,dy=y-sy;
 if(!axis){if(Math.abs(dx)<10)return;if(Math.abs(dx)<=Math.abs(dy))return;axis=true}
 if(dx>0&&index<pages.length-1){
   const w=cur.getBoundingClientRect().width,p=Math.min(1,dx/w);
   cur.style.transform=`translateX(${dx}px)`;
   cur.style.boxShadow=`${-12-22*p}px 0 ${18+22*p}px rgba(0,0,0,.28)`;
   const r=cur.getBoundingClientRect();curl.style.display="block";curl.style.left=Math.max(0,r.left-23)+"px";
   curl.style.opacity=String(.35+.65*Math.sin(p*Math.PI/2));curl.style.transform=`scaleX(${.65+.55*Math.sin(p*Math.PI)})`;
 }else if(dx<0&&index>0)cur.style.transform=`translateX(${dx*.28}px)`;
}
function end(x,y){
 if(!drag)return;drag=false;const dx=x-sx,w=cur?cur.getBoundingClientRect().width:innerWidth,th=Math.min(72,w*.16);curl.style.display="none";
 if(dx>th&&index<pages.length-1){cur.style.transition="transform .28s cubic-bezier(.18,.75,.18,1)";cur.style.transform=`translateX(${Math.max(innerWidth,w)+30}px)`;setTimeout(()=>{index++;render()},280)}
 else if(dx<-th&&index>0){index--;render()}
 else if(cur){cur.style.transition="transform .22s ease";cur.style.transform="translateX(0)";cur.style.boxShadow=""}
}
stage.addEventListener("touchstart",e=>{if(e.touches.length===1){const t=e.touches[0];begin(t.clientX,t.clientY)}},{passive:false});
stage.addEventListener("touchmove",e=>{if(e.touches.length===1){e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY)}},{passive:false});
stage.addEventListener("touchend",e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY)},{passive:false});
stage.addEventListener("touchcancel",()=>{drag=false;render()},{passive:false});
stage.addEventListener("mousedown",e=>begin(e.clientX,e.clientY));
window.addEventListener("mousemove",e=>move(e.clientX,e.clientY));
window.addEventListener("mouseup",e=>end(e.clientX,e.clientY));
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
