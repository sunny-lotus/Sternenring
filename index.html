平気そうだ。

ナハトはヴォルトへカップを押す。

「先どうぞ」

ヴォルトも押し返す。

「いやいや、客人から」

「お前も客人だろ」

「年長者を敬う文化があってね」

「同い年だ」

「細かいな」

フレアが二人を見る。

「飲まないの？」

ナハトは覚悟を決めた。

「飲むよ」

一口。

止まった。

フレアが尋ねる。

「どう？」

ナハトは慎重に答えた。

「個性的だね」

ヴォルトがナハトの顔を見る。

「まずいんだな」

「お前も飲め」

ヴォルトも一口。

しばらく黙る。

「……個性的だな」

ナハトが頷く。

「だろ？」

フレアが嬉しそうに笑った。

「おばあちゃんも同じこと言ってた」

「本当？」

「うん。毎回」

ナハトがカップを見る。

「改善しようとは思わなかった？」

「おばあちゃんが味覚の方を鍛えろって」

ヴォルトが感心したように息を吐く。

「強いな、おばあちゃん」

ナハトが笑い、それから何気なく聞いた。

「そういえば、おばあちゃんは？」

家には三人しかいない。

フレアは少しだけ黙った。

「春に死んだよ」

あまりにも普通の声だった。

ナハトの笑みが消えた。

ヴォルトもカップを置く。

「……そうか」

「うん」

フレアは窓の外を見る。

「すごく長く生きたから、もういいんだって」

ナハトが静かに尋ねる。

「本人が？」

「うん。最後の日も、お茶がまずいって怒ってた」

ヴォルトが思わず言う。

「元気じゃねえか」

「そのあと死んだ」

「急だな……」

フレアは笑った。

寂しそうではあった。

けれど、泣きそうな顔ではなかった。

ナハトはそれ以上聞かなかった。

代わりに、カップをもう一度口へ運ぶ。

やっぱりまずかった。

◇

「……しかし、ただの森の魔女じゃなさそうだな」

ヴォルトは一冊の古びた本を開いた。

最初は普通だった。

魔力。

術式。

回路。

ヴォルトにも理解できる内容。

だが、途中から変わった。

余白いっぱいに、別の筆跡で書き込みがある。

『術式を介さず』

『対象との――』

そこから先は、インクが滲んで読めない。

次のページには植物の根、人間の身体、星獣らしき生物。

それらを、いくつもの線が結んでいる。

ナハトが覗き込む。

「なんだ、これ」

ヴォルトは首を横に振る。

「分からん」

「専門家だろ」

「だから分からんのがおかしいんだ」

ヴォルトはページをめくる。

「少なくとも、普通の魔法理論じゃない」

フレアが横から覗き込んだ。

「あ。それ、おばあちゃんがよく読んでた」

ヴォルトがすぐ尋ねる。

「意味は？」

「難しいから読んでない」

「だろうな」

ヴォルトの視線が、もう一冊へ向かう。

表紙に文字はない。

ただ、円のようなものが描かれ、その中央に小さな星。

ヴォルトが手を伸ばす。

「それはダメ」

フレアの声が変わった。

ヴォルトの手が止まる。

「……ダメ？」

「うん」

フレアはその本を棚の奥へ戻した。

「おばあちゃんが、誰にも見せちゃダメって」

「理由は？」

「知らない」

ヴォルトは棚を見る。

ナハトも見ていた。

だが、何も言わなかった。

◇

しばらくして、話は星獣へ戻った。

フレアが窓の外を見ながら言う。

「あの子たち、最近ずっと落ち着かないの」

ナハトが聞き返す。

「あの子たち？」

「星獣」

ヴォルトが少し顔をしかめる。

「……あれを『あの子たち』って呼ぶ人、初めて見た」

「そう？」

「普通は逃げるか討伐するかだな」

フレアの表情が少し曇った。

「どうして？」

「危険だからだ」

「でも、何もしなければ襲わないよ」

ヴォルトが椅子へ座り直す。

「昨日、街に来た」

「うん」

「大騒ぎだった」

フレアは二人を見る。

「でも人は襲ってないでしょ？」

ナハトとヴォルトが止まる。

ヴォルトが聞く。

「……お前も知ってたのか？　街に行ったこと」

「ううん」

「じゃあ、なんで」

フレアは不思議そうに答えた。

「だって、あの子たち、人を食べないよ」

ナハトはカップを置いた。

ヴォルトも何も言わない。

昨日。

確かに星獣たちは人の間を走っていた。

だが、最初に攻撃したのは――。

「最近、ずっと何か探してる」

フレアが続ける。

ヴォルトが聞く。

「探してる？」

「うん」

「何を？」

「分からない」

フレアは少し考え、ナハトを見る。

「たぶん、あなた」

沈黙。

ヴォルトがナハトを見る。

「ナハト」

「ん？」

「今度こそ何か言え」

ナハトは少し考えた。

「いやぁ……人気者はつらいね」

ヴォルトがため息をつく。

「星獣に好かれてどうする」

「選り好みはよくないだろ」

「人類でいろ」

フレアが笑った。

「やっぱり、お話の人と違うね」

ナハトがすぐ返す。

「ほら、人違い」

「でもナハトだと思う」

「どうして」

「なんとなく」

「一番信用できないやつだ」

フレアは迷わず答える。

「私は信用してるよ」

ナハトが一瞬黙る。

「……会って半日も経ってないけど？」

「うん」

「俺、悪い奴かもしれないよ？」

「違うよ」

「なんで？」

フレアはまっすぐナハトを見る。

「星獣を斬らなかったから」

ナハトの口が止まった。

フレアはそれ以上何も言わない。

ヴォルトだけが、ちらりとナハトを見た。

◇

夕方。

ナハトとヴォルトは森を出る準備を始めた。

ナハトが外套を整える。

「じゃあな」

「うん」

フレアは普通に答えた。

二人が歩き出す。

十歩。

後ろから足音。

ナハトが止まり、振り返る。

フレアがいる。

「……何してるの？」

「行く」

「どこに？」

「一緒に」

「誰と？」

「ナハト」

「俺？」

「うん」

「なんで？」

「確かめたいから」

「何を？」

「お話の続き」

ナハトはヴォルトを見る。

ヴォルトは空を見る。

「俺を見るな」

「止めてよ」

「お前が待たれてたんだろ」

「他人事だと思って」

ナハトはフレアへ向き直った。

「俺たちについてくるなら、危ない仕事にも巻き込むよ」

「大丈夫」

「本当に？」

フレアは迷わず頷いた。

「ナハトもいるし」

ナハトが少し目を瞬く。

「……それ、信用されてるってことでいい？」

フレアは頷いた。

「うん」

ナハトは少し困ったように笑った。

フレアが続ける。

「私、魔法使えるよ」

今度はヴォルトが即答した。

「それが一番不安なんだよ」

「どうして？」

「説明できない魔法を自信満々に使うからだよ！」

「使えるからいいでしょ？」

「よくない！」

ナハトは横で笑いを堪えていた。

ヴォルトが睨む。

「何笑ってる」

「いや。頑張れ、専門家」

「俺に丸投げすんな！　こいつ、お前についてくるんだろ！」

「俺、まだ許可してないけど」

フレアが言う。

「行くよ」

「……決定事項なんだ」

「うん」

◇

結局、フレアはついてきた。

正確には、ナハトが許可したわけでも、ヴォルトが納得したわけでもない。

ただ歩き始めた二人の後ろを、普通についてきた。

そして、何度追い返しても、ついてきた。

森の出口が見える。

夕陽が木々の向こうから差し込んでいた。

ナハトとヴォルトが先に進む。

フレアだけが、ふと足を止めた。

振り返る。

森の奥。

木々の影。

そこに、いくつもの目があった。

星獣たち。

遠くから、静かにこちらを見ている。

襲ってこない。

唸りもしない。

ただ、見ている。

フレアは少しだけ笑った。

「行ってくるね」

返事はなかった。

風が吹く。

木々が揺れる。

フレアは前を向いた。

「フレアー？」

遠くからナハトの声。

「置いてくぞー」

「今行く！」

フレアは走り出した。

森を抜ける。

その先で、ナハトとヴォルトが待っていた。

二人だった旅に、一人が増えた。

三人は夕暮れの街道を歩き出した。"},{"type":"chapter","title":"第四章","sub":"三人目の宿代","text":""},{"type":"text","text":"ノルンの城壁が見えた頃には、夕暮れが街を包み始めていた。

門の上には導機灯が並び、淡い白光が石壁を照らしている。

そのさらに上。

空を大きく横切る星環は、昨日と変わらず静かに輝いていた。

「着いた」

フレアが足を止める。

ナハトが振り返った。

「ノルン」

「うん。大きいね」

ヴォルトが杖をつきながら横を通る。

「感想それだけか！」

フレアは城壁を見上げた。

「村よりずっと大きいし、明るい」

「増えたな」

ナハトが笑う。

「こんな大きい街は初めて？」

「うん。おばあちゃんと行ってたのは、もっと小さいところ」

ナハトが頷いた。

「じゃあ、こういう大きな街は初めてなんだ」

「うん。こんなに人がいるのも初めて」

ヴォルトが鼻で笑った。

門をくぐろうとしたところで、フレアが足を止める。

視線の先には、門の脇に立つ一本の柱。

透明な覆いの中で、白い光が浮かんでいた。

「導機灯？」

ヴォルトが少しだけ目を上げる。

「知ってるのか」

「村の宿にもあった。こんなに大きくなかったけど」

「こっちは街路用だな。夜の間ずっと点ける」

フレアは門の内側を見た。

同じ灯りが、通りの奥まで並んでいる。

「全部？」

「全部」

しばらく見たあと、フレアが言う。

「……もったいない」

ヴォルトが眉を上げる。

「何が？」

「魔力」

「まあ、そういう考え方もあるか」

ナハトは二人の間を通り抜けた。

「はいはい。魔法談義は宿取ってからにしよう。俺はもう腹減った」

ヴォルトが呆れる。

「お前、森を出てからそれしか言ってないぞ」

「人間、腹が減ると死ぬからね」

フレアが真顔で答えた。

「たぶん、もう少し持つ」

ナハトが振り返る。

「どっちの味方？」

「事実」

「なんか、この三人だと俺だけ扱い雑じゃない？」

フレアが一瞬止まった。

「三人？」

ナハトの足も、一瞬だけ止まる。

「……まあ、今は三人だし」

そのまま前を向く。

ヴォルトは何も言わなかった。

ただ、少しだけ笑っていた。

◇

門をくぐると、ノルンの街は昨日の騒ぎが嘘だったかのように動いていた。

壊れたものを直す音と、いつもの暮らしの音が同じ通りに混じっている。

壊れた露店には新しい板が打ちつけられ、石畳にはまだ爪痕が残っている。

広場の一角では職人たちが割れた導機灯を交換していた。

そのすぐ横を、買い物籠を持った女が歩いていく。

子どもたちは走っている。

屋台からは肉を焼く匂いが漂っていた。

フレアが足を緩める。

「……もう直してる」

ナハトが横目で見る。

「この街の人たち、こういうの得意だからね」

「直すの？」

ヴォルトが答える。

「壊れたままじゃ困るだろ。明日も飯を食わなきゃならないし、店も開けなきゃならない。祭りが終わっても生活は続く」

フレアはしばらく職人たちを見ていた。

「強いね」

今度はヴォルトも突っ込まなかった。

三人は広場を抜け、市場通りへ入る。

夕方になっても店は多い。

果物。

乾燥肉。

布。

薬草。

導具。

食器。

店先の小さな導機が風を送り、吊るされた飾り布を揺らしている。

薬草店の前で、フレアが足を止めた。

「これ」

小さな葉を束ねたものが並んでいる。

フレアは値札を見て、目を丸くした。

「大銅貨三枚？」

ナハトも覗く。

「するねえ」

「村だと、こんなにしないよ」

ヴォルトが葉を一枚見た。

「ここまで運ぶ手間が乗ってるんだろ。採る、乾かす、運ぶ、保管する。その分だ」

フレアは葉と値札を交互に見る。

「じゃあ、森で採ってここに持ってきたら――」

ナハトが先回りした。

「明日森に戻って全部採ってこようとか考えるなよ」

フレアが振り返る。

「まだ何も言ってない」

「顔に書いてある」

「そんな顔してた？」

「金のなる草を見つけた顔」

フレアは自分の頬を触った。

ヴォルトが口を挟む。

「それと、採れる場所を知らない商人に全部教えるなよ」

「それは知ってる」

ヴォルトが少し止まった。

「知ってるのか」

「おばあちゃんに言われた。薬草の場所は簡単に教えるなって」

ナハトが笑う。

「おばあちゃん、抜け目ないね」

「商売だからね」

「森の謎の女だと思ってた」

「それは合ってる」

「合ってるんだ」

フレアは店先の薬草をもう一度見た。

「でもノルン、高いね」

「それは合ってる」

ナハトが真顔で頷いた。

◇

市場を抜けたあと、三人は依頼所へ寄った。

ナハトとヴォルトは帰還を告げ、森で確認したことを簡単に口頭で伝える。

報酬はそこで受け取り、詳しい報告書は翌朝までに提出することになった。

宿は《銀鹿亭》。

ナハトとヴォルトがノルンに滞在するとき、よく使っている宿だった。

一階は酒場になっていて、夕食時ということもあり賑わっている。

受付の女主人がナハトを見る。

「あら。生きて帰ったの」

「ひどい挨拶だなあ」

「昨日あんなことがあったでしょう。あんた、絶対首突っ込んだと思ってたから」

「人聞きの悪い。俺は平和を愛する男ですよ」

女主人が腰の刀を見る。

「その刀置いてから言いな」

「ごもっとも」

女主人の視線がヴォルトへ移り、その後ろで止まった。

「……増えた？」

ナハトが即答する。

「拾った」

フレアも即座に返す。

「拾われてない。ついてきた」

ヴォルトがため息をついた。

「もっと悪いだろ」

女主人は三人を順番に見る。

「で、部屋は？」

「二部屋」

ナハトが答えた。

「俺とこいつで一部屋。彼女に一部屋」

フレアが鍵の棚を見る。

「三人で一部屋でもいいよ」

沈黙。

ナハトがゆっくり振り返る。

「よくない」

「どうして？」

「どうしてと言われましても」

「旅人の大部屋なら一緒になるでしょ？」

ナハトが一瞬詰まる。

ヴォルトが笑った。

「正論だな」

「味方しろよ」

フレアは首を傾げる。

「二部屋だと高いよ」

女主人が鍵を二つ取りながら言う。

「一泊、朝食付きで一部屋銀貨三枚」

フレアが眉を上げた。

「やっぱり高い」

ナハトが指を差す。

「ほら」

「何が『ほら』だ」

ヴォルトが突っ込む。

フレアは女主人に尋ねた。

「村の宿より高いのは、街だから？」

「立地と祭り明けだからねえ」

女主人が笑う。

「でも二部屋にしときな。この黒いのがうるさいから」

「俺？」

「自覚ないの？」

「ないです」

「だろうね」

鍵が二つ、卓に置かれた。

◇

夕食は、一階の酒場で取ることになった。

煮込み肉と黒パン。

豆のスープ。

焼いた根菜。

フレアは一口食べると、少しだけ目を丸くした。

ナハトがそれを見逃さない。

「うまい？」

「おいしい」

「よかったね」

フレアは皿を見た。

「もう一個頼んでいい？」

「いいよ」

「自分で払う」

ナハトが一瞬止まる。

「……成長が早い」

「最初から知ってるよ」

「そうでした」

ヴォルトが笑う。

「お前が勝手に世間知らず扱いしてるだけだろ」

ナハトは懐から革袋を出した。

中には、今日受け取った報酬が入っている。

《エルデ森林・星獣追跡調査》。

大銀貨八枚。

「そういや、これ」

ナハトは卓へ硬貨を置いた。

「今回の報酬」

ヴォルトが経費分を横へ分ける。

「依頼を受けたのは俺たち二人だけど、現地で協力した分は出していいだろ」

フレアが二人を見る。

「私も？」

「星獣を見つけたのは俺たちだけど」

ナハトが言う。

フレアは指を一本立てた。

「治した」

「それ言われると弱いな」

ヴォルトが大銀貨を一枚、フレアの前へ滑らせる。

「協力分」

フレアは硬貨を手に取った。

「大銀貨一枚？」

「少ない？」

「逆。こんなにもらっていいの？」

ヴォルトが頷く。

「いい。危険手当込み」

ナハトが口を挟む。

「ただし明日全部お菓子にしないように」

フレアは硬貨をしまった。

「しないよ」

数分後。

追加の料理が届いた。

ナハトが皿を見る。

「食べ物にはした」

「ご飯は必要でしょ」

フレアは自分の皿をナハトの方へ少し寄せる。

「ナハトも食べていいよ」

ナハトの表情が緩む。

「……いい子だなあ」

ヴォルトが呆れた。

「ちょろいぞ、お前」

◇

夜。

ナハトとヴォルトの部屋。

ナハトは寝台に腰掛け、刀を膝に載せていた。

鞘から抜き、布で刃についた汚れを拭っていく。

星獣の爪を何度も受けたはずなのに、刀には刃こぼれひとつない。

向かいでは、ヴォルトが机に紙を広げていた。

「報告、どうする」

ナハトは刃を拭きながら答える。

「見たままでいいんじゃない？」

「術式なしの治療も？」

刃を拭いていた手が止まった。

「それはなし」

「だよな」

ヴォルトはあっさり同意した。

ナハトが顔を上げる。

「意外」

「俺にも説明できないものを報告書に書いてどうする」

ヴォルトはペンを走らせる。

「負傷した星獣一体を近距離で確認。ほか複数個体を森の奥に確認。積極的な攻撃行動は確認できず――」

少し止まる。

「……これも書くか」

「何？」

「人を避けて移動した形跡」

ナハトは答えなかった。

森の中。

折られていなかった枝。

踏まれていなかった白い花。

そして、自分の前で止まった星獣。

「見たことは書いとけば？」

ヴォルトが横目で見る。

「珍しく真面目だな」

「いつも真面目ですよ」

「はいはい」

ペンが再び動く。

しばらく、紙を擦る音だけがした。

やがてナハトが言う。

「ヴォルト」

「ん？」

「フレア、どうする？」

ペンが止まった。

ヴォルトは顔を上げずに答える。

「お前についてきたんだろ」

「そうなんだよねえ」

「嫌なら言えばいい」

「別に嫌じゃない」

即答だった。

自分でも少し早かったと思ったのか、ナハトは刀を鞘へ戻した。

「ただ、ほら。俺たち別に観光してるわけじゃないし」

「傭兵二人について歩く方が、森に一人でいるより安全かは微妙だな」

「でしょ？」

扉が叩かれた。

二人がそちらを見る。

ナハトが声をかける。

「開いてるよ」

フレアが入ってきた。

手に三つの木杯を持っている。

湯気が立っていた。

「お茶」

ナハトとヴォルトが黙る。

フレアが二人を見る。

「……どうしたの？」

「いや」

ナハトが笑う。

「ちょうど君の今後について話してたところ」

フレアは木杯を置いた。

「行くよ」

「まだ何も聞いてないけど」

「二人と」

「だから」

「だめ？」

まっすぐだった。

ナハトはこういう目が苦手だ。

冗談が入り込む隙間がない。

だから木杯を手に取った。

「まあ、働いてもらうけどね」

「働く」

「飯代も」

「払う」

「宿代も」

「払う」

ナハトが肩をすくめる。

「しっかりしてるねえ」

フレアが眉を寄せた。

「当たり前でしょ」

ヴォルトが吹き出す。

「正しい」

「二人とも厳しくない？」

ナハトが茶を一口飲んだ。

止まった。

ヴォルトがその顔を見る。

「……どうした？」

ナハトは静かに木杯を置く。

「フレア」

「うん」

「これ、何？」

「お茶」

「何を入れた？」

「葉っぱ」

「それは知ってる」

ヴォルトも恐る恐る飲む。

沈黙。

「……苦いな」

フレアが少し嬉しそうに頷く。

「でしょ？」

ヴォルトが顔をしかめた。

「お前なんで嬉しそうなんだ」

フレアは自分の分を飲む。

平然としている。

「おばあちゃんも、まずいって言ってた」

ナハトがカップを見る。

「改善しようとは思わなかった？」

「したよ」

「これで？」

「さっきよりおいしい」

ナハトとヴォルトは顔を見合わせた。

ナハトが真顔になる。

「ヴォルト」

「なんだ」

「明日も生きてたら仕事探そう」

「そこまでじゃない」

「失礼だね」

フレアが少しだけ頬を膨らませた。

その夜。

銀鹿亭の二階に、部屋が二つ取られた。

片方に二人。

片方に一人。

まだ、それだけだった。

三人組と呼ぶには、少し早い。

けれど翌朝。

朝食の卓には最初から椅子が三つ並んでいた。"},{"type":"chapter","title":"第五章","sub":"空飛ぶ商隊","text":""},{"type":"text","text":"その朝。

ナハトとヴォルトが一階へ降りると、三つ並んだ椅子の一つにフレアが座っていた。

黒パンをちぎっている。

「早いね」

フレアは黒パンから顔を上げた。

「二人が遅い」

「俺たちが普通です」

「お前が最後まで寝てただけだろ」

杖をつきながら降りてきたヴォルトが、ナハトの背中を小突いた。

女主人が朝食の皿を二つ置く。

フレアは昨日もらった大銀貨を指先でつまんだ。

「これ、崩してもらえる？」

「あいよ」

女主人が慣れた手つきで細かい硬貨を数える。

ナハトは席につきながら、その様子を眺めた。

「昨日もらったばっかりなのに、もう崩すの？」

「大銀貨のままだと使いにくいから」

ヴォルトがパンを手にしたまま頷く。

「正しい」

ナハトは自分の財布を見た。

「俺よりちゃんとしてない？」

フレアが答える。

「ナハトが雑なんじゃない？」

「朝から厳しいねえ」

ヴォルトが笑った。

「三人になっても、お前の立場は変わらなそうだな」

「そこは少しくらい優しくしてくれてもよくない？」

フレアは崩してもらった硬貨を丁寧に袋へしまった。

◇

朝食のあと、三人は仕事を探しに《渡り鳥の止まり木》へ向かった。

壁一面に依頼書が貼られている。

荷運び。

街道警備。

薬草採取。

害獣駆除。

行方不明の家畜探し。

フレアが一枚を指した。

「鶏、十二羽」

ナハトは一瞥した。

「却下」

「なんで？」

「三人で初めて受ける仕事が鶏探しなの、嫌じゃない？」

「仕事を選ぶな」

ヴォルトが言った。

ナハトは依頼書を彼へ差し出した。

「じゃあお願いします」

「……ほかを見よう」

「選んだ」

フレアが言う。

「うるさい」

そのとき、受付の男が声を張った。

「今日出るハルバ商会！　護衛があと三人足りないぞ！」

ナハトとヴォルトが同時に顔を向ける。

ノルンから南の交易都市リュネまで二泊三日。

街道護衛。

報酬、一人につき大銀貨二枚。

ナハトは迷わず依頼書を取った。

「これで」

「早いな」

ヴォルトが覗き込む。

「三人で六枚」

「串焼き何本分？」

「その換算やめろ」

◇

南門を出ると、ハルバ商会の商隊が待っていた。

先頭に馬が二頭。

その後ろに、大きな荷車が六台。

さらに客車が二台続いている。

ただし――。

荷車に、車輪がなかった。

地面から手のひら二つ分ほど浮かび、荷台の下では青白い光が規則正しく脈打っている。

フレアが足を止めた。

「……浮いてる」

「浮いてるね」

ナハトも隣で眺める。

フレアは少し近づいた。

「こんな大きいの、初めて見た」

「村じゃ使わない？」

ヴォルトが尋ねる。

「小さい荷台なら見たことある。でも、車輪もついてた」

「こいつは荷重の大半を浮遊回路で逃がしてる。馬は操舵と補助だな」

ヴォルトはもう荷車の下を覗き込んでいた。

「四点支持か。後ろだけ補助回路が独立してる。長距離用に――」

ナハトがフレアへ小声で言う。

「始まった」

「長い？」

「放っとくと」

「聞こえてるぞ」

荷車の下から声がした。

商隊長バルドが歩いてくる。

日に焼けた大柄な男だった。

「お前らが追加の護衛か？」

「そうです」

ナハトが答える。

バルドの視線がフレアで止まった。

「そっちの嬢ちゃんも？」

「魔法使えます」

フレアが先に答えた。

ヴォルトが横で小さく呟く。

「そこだけ聞くと非常に頼もしいんだよな……」

「何？」

「何でもない」

◇

商隊は昼前に出発した。

浮遊荷車は、車輪の荷車よりずっと静かだった。

石の上を越えても大きく跳ねない。

荷物を積んだ巨体が、するすると街道を進んでいく。

フレアはしばらく横を歩いていた。

「全部これにすればいいのに」

「高いからな」

ヴォルトが答える。

「作るのが？」

「作るのも。維持するのも。動かすのも」

彼は荷車の下で瞬く光を指した。

「術式があるだけじゃ動かない。魔力を溜める槽もいるし、回路も摩耗する。壊れれば部品も要る」

「馬もご飯食べるよ」

「食べるな」

「どっちが安い？」

「距離と荷物と土地による」

フレアは少し考えた。

「何でも『場合による』って言うね」

ヴォルトが言葉に詰まった。

ナハトが笑う。

「専門家が困ったときに使う便利な言葉なんだよ」

「違う」

「場合による？」

「お前は黙れ」

街道には商隊以外の旅人も多かった。

背に大荷物を負った男。

籠を抱えた老夫婦。

子どもを荷車に乗せ、自分は歩く母親。

一方、商隊の後ろについた客車では、上等な服を着た客たちが柔らかな座席に座っていた。

フレアがちらりと見る。

「乗れるんだ」

「金払えばね」

ナハトが答えた。

「高い？」

「俺たちなら歩く」

「分かった」

「何が？」

「高い」

「正解」

昼。

街道沿いの休憩所で商隊が止まった。

護衛たちは自分で水を汲み、客車の客には商会の使用人が水と食事を運ぶ。

フレアは水筒へ水を入れながら、客車の方を見ていた。

「同じところまで行くのにね」

ヴォルトが隣で手を洗う。

「ん？」

「歩く人と、座ってる人がいる」

「ああ」

「村でもお金持ちはいるけど、こんなに違うのは初めて見た」

ヴォルトは手についた水を払った。

「街が大きくなると、差も見えやすくなる」

「どうして？」

「生まれとか仕事とか、持ってる土地とか、人とのつながりとか」

「お金も？」

「もちろん」

フレアは少し黙った。

それから休憩所の脇に生えた大きな木を見上げる。

「森も場所取りするよ」

「場所取り？」

「大きな木が光をいっぱい取る。でも、その下に小さい木も生える」

ナハトが串焼きの代わりに干し肉を噛みながら笑った。

「なかなか怖い話だね」

「でも、大きい木が倒れたら、下の木に光が当たる」

「もっと怖くなった」

「？」

「そのままでいて」

◇

午後。

商隊の中央を走っていた荷車が、突然大きく傾いた。

「止めろ！」

バルドの声が飛ぶ。

馬が止まり、護衛たちが周囲へ散る。

右後部だけが地面へ沈み、荷台が斜めになっている。

ヴォルトはすぐにしゃがみ込んだ。

「浮遊回路が落ちてる」

外装を開ける。

中から熱気が漏れた。

「冷却槽が空だ。漏れたか？」

ナハトが荷車の下を覗く。

「直る？」

「水と時間」

「水ならあるよ」

フレアが言った。

ヴォルトが顔を上げる。

「どこに？」

「向こう」

彼女は街道脇の草地へ入っていった。

ナハトも耳を澄ます。

何も聞こえない。

「何があるの？」

「水」

「見えないけど」

「音するよ」

しばらく進むと、斜面の陰から細い流れが現れた。

土の間から染み出した湧き水だった。

ヴォルトが遅れてやって来る。

「よく分かったな」

「森にいると分かるよ」

「俺には分からない」

ナハトが言う。

フレアは振り返った。

「ナハト、森で生きるの下手そう」

「失礼だな」

「都会育ちだから？」

ヴォルトが吹き出した。

「お前、それまだ言ってんのか」

◇

一時間後。

冷却槽へ水が戻り、ヴォルトが交換した管を締める。

青白い光が一つずつ点いた。

傾いていた荷台が、ゆっくり持ち上がる。

フレアが目を輝かせた。

「直った」

「当然」

ヴォルトは工具をしまいながら、少しだけ得意そうだった。

「さっき魔法使ってなかったよね」

「使ってる」

「光るのは導機でしょ？」

「その導機の中で魔法が動いてるんだよ」

「ヴォルトは管直しただけ」

「だけって言うな」

ナハトが肩を叩く。

「ほら。専門家が傷ついてる」

「お前は何もしてないだろ」

「水運びました」

「二往復な」

「十分じゃない？」

「俺、五往復したぞ」

「若者は元気だなあ」

「同い年だろ！」

バルドの笑い声が響いた。

◇

一日目の夜は、小さな宿場町で泊まった。

フレアは以前にも魔女と似たような宿場へ来たことがあるらしく、宿そのものには驚かなかった。

驚いたのは、護衛八人が一つの大部屋へ押し込まれたことだった。

並んだ寝台を見て、フレアが尋ねる。

「今日は同じ部屋？」

「仕事だからね」

ナハトが荷物を置く。

「銀鹿亭では分けてたのに」

「仕事には負けました」

ヴォルトが杖を壁へ立てかける。

「別に妙な決まりがあるわけじゃないからな。空きと金と状況だ」

フレアは納得したらしく頷いた。

「なるほど」

ナハトが振り返る。

「……あれ？」

「何だ」

「普通に納得した」

「何を期待してたんだよ」

◇

夜。

宿の外には、小さな石造りの祠があった。

商隊の老人が一人、星環へ向かって祈っている。

フレアとナハトは少し離れた場所でそれを見ていた。

空には白い輪。

森から見たものと、同じ星環。

「村でも祈ってたよ」

フレアが言う。

「旅の前とか、病気のときとか」

「普通はそんな感じじゃない？」

「おばあちゃんは、あんまりしなかった」

ナハトが彼女を見る。

「そうなの？」

「祈るなとは言わなかった。でも、自分はしなかった」

「へえ」

「ナハトは？」

「俺？」

ナハトは星環を見上げた。

「……困ったときだけかな」

窓が開いた。

「お前ら！　明日早いぞ！」

ヴォルトの声が夜へ飛ぶ。

ナハトが笑った。

「お母さんが呼んでる」

「誰がお母さんだ！」

フレアも笑う。

三人で受けた最初の仕事は、まだ始まったばかりだった。

それでも。

二人の旅に一人が増えたという事実は、もう少しずつ、当たり前になり始めていた。"},{"type":"chapter","title":"第六章","sub":"炎の収穫祭","text":""},{"type":"text","text":"三日目の夕刻。

ハルバ商会の旗がリュネの門をくぐった。

「着いた！」

フレアが両手を上げる。

その隣でナハトは肩を回した。

「元気だねえ」

「ナハトもやれば？」

「大人には、やっていいことと悪いことがあるんですよ」

ヴォルトが杖を鳴らす。

「昨日、宿で枕投げてた奴が何言ってんだ」

「護衛の連中が先に投げてきた」

「子どもか」

報酬は、一人につき大銀貨二枚。

フレアは受付で一枚だけ細かい硬貨へ崩してもらった。

ナハトが見る。

「計画的」

「パン買うから」

「全部？」

「余ったら干し果物」

ヴォルトが頷く。

「ナハトより金の使い方うまいな」

「まだ負けてない」

「何の勝負だよ」

◇

次の目的地は、導機と魔法研究の都市レグルス。

ヴォルトがかつて導機を学んだ街でもある。

翌朝。

三人はリュネを出た。

そして昼過ぎ。

道を間違えた。

「……ナハト」

後ろからヴォルトが呼ぶ。

「何？」

「太陽、さっきからずっと右にないか？」

「そういう日なんじゃない？」

「どういう日だ」

フレアは地図と街道標を見比べる。

「この道、レグルス方面じゃないよ」

「ほら」

「まだ分からないだろ」

「何が」

そこへ、麦を満載した荷車が向こうからやって来た。

荷台に乗った子どもたちが三人へ手を振る。

「どこ行くのー！」

ナハトが手を振り返した。

「レグルスー！」

子どもたちは顔を見合わせた。

そして声を揃える。

「逆ー！」

沈黙。

ヴォルトがゆっくりナハトを見る。

ナハトは爽やかに笑った。

「早めに気づけてよかったね」

「お前な」

◇

荷車について着いたのは、農村アウレだった。

見渡す限りの麦畑。

黄金色の穂が風の波に揺れ、その向こうでは村人たちが収穫した麦を束ねている。

村の中央には、家二階分ほどもある巨大な麦藁の人形が立っていた。

フレアが見上げる。

「大きい」

近くにいた子どもが胸を張った。

「麦守り様！」

「今夜燃やすんだぞ！」

フレアは少し驚いた。

「燃やすの？」

「うん！」

「せっかく作ったのに？」

「だから燃やすんだよ！」

フレアはますます分からない顔になる。

ナハトが小声で言った。

「村によって祭りって全然違うね」

「私が行ったところでは、小さい藁束を川に流してた」

「へえ。川に流す祭りもあるんだ」

フレアがじっと見る。

「ナハト」

「はい」

「私を何だと思ってるの？」

「森から出てきた謎の女」

少し考えてから、フレアが頷いた。

「だいたい合ってる」

ヴォルトが笑った。

◇

今夜は収穫祭だから泊まっていけ。

村の老人はそう言った。

ナハトが一応尋ねる。

「宿代は？」

「祭りの日に旅人から取るかよ」

「太っ腹」

フレアが笑う。

「こういう村、おばあちゃんと来たことある」

「じゃあ今回は俺より詳しそうだ」

「ナハトは道も分からないからね」

「まだ引っ張る？」

「しばらくは」

◇

村には導機灯がほとんどなかった。

夜は油灯。

畑を潤すのは大きな水車と木の水路。

ただ、高い畑へ水を送る場所には古い揚水用の魔法設備が残されていた。

ヴォルトが足を止める。

「古いな」

石組みの設備には、長い年月で薄くなった術式が刻まれている。

「循環と干渉を組み合わせてる。ずいぶん単純だけど、こういう方が壊れにくい」

近くの農夫が振り返った。

「兄ちゃん、分かるのか？」

「少しなら」

その結果。

ヴォルトは祭りの準備そっちのけで、水路の修理に捕まった。

「故障じゃないな」

彼は袖をまくり、泥だらけの水路を覗く。

「詰まってる」

農夫が頭を掻いた。

「先週掃除したんだけどなあ」

「ここ。曲がり角に泥が溜まってる」

フレアが横から覗いた。

「魔法じゃなかったね」

「魔法が動かなくなったからって、魔法が悪いとは限らないんだよ」

ナハトは少し離れた石に座っていた。

「人生みたいな話だね」

ヴォルトが泥の塊を投げた。

ナハトが避ける。

「働け」

「危なっ」

◇

一方。

フレアは薬草を仕分けていた村の女たちに捕まった。

「あんた、この草分かる？」

「熱下げるやつ」

「これは？」

「お腹」

「こっちは？」

フレアが一枚噛んだ。

顔をしかめる。

「苦いだけ」

女たちが笑った。

少し離れたところから、ナハトが眺めている。

「馴染むの早いなあ」

水路から戻ったヴォルトが手を洗った。

「森じゃ、俺たちよりよっぽど役に立つからな」

「俺も役に立ってるよ？」

「何した」

ナハトは考えた。

「子どもに剣見せた」

「遊んでただけじゃねえか」

◇

夕暮れ。

村の中央に長い卓が並んだ。

焼いた肉。

豆。

麦粥。

果物。

魚。

大量のパン。

樽からは酒が注がれる。

笛と太鼓が鳴り始めると、村人たちが麦守り様を囲んで踊り始めた。

フレアは一度見ただけで輪へ入った。

「ナハト！」

「嫌な予感」

「来て！」

「ほら来た」

腕を掴まれる。

そのままナハトも踊りの輪へ。

ヴォルトは笑って見ていたが、次の瞬間にはナハトに襟を掴まれていた。

「一人だけ逃げるのずるいよね？」

「離せ！」

三人が並ぶ。

右。

左。

一歩。

手を叩く。

「ナハト、逆！」

フレアが笑う。

「分かってる！」

「分かってない！」

ヴォルトが叫ぶ。

その拍子に、ナハトの踵がヴォルトの足を踏んだ。

「痛っ！」

「ごめん！」

「そっちは俺の足だ！」

「知ってる！」

「じゃあ踏むな！」

◇

踊りが一段落した頃。

村の子どもたちが三人の周りに集まっていた。

一人の少女が尋ねる。

「みんな、家族？」

ナハトとヴォルトが同時に答えた。

「違う」

フレアは二人を見た。

「じゃあ何？」

一瞬。

ナハトとヴォルトが黙った。

「仕事仲間？」

ナハトが言う。

「幼馴染だろ、俺らは」

ヴォルトが返す。

フレアが自分を指す。

「私は？」

「……同行者？」

「ついてきた人」

「ナハト、それ雑」

子どもたちはよく分からないまま走っていった。

フレアは二人を見ている。

ナハトが笑った。

「何？」

「別に」

「絶対なんかある顔じゃん」

「そのうち決まるかなって」

「何が？」

「私たち三人が、何なのか」

ナハトは返事をしなかった。

その代わり、卓からパンを一つ取った。

「腹減ったな」

「逃げた」

ヴォルトが言う。

「逃げてないです」

◇

夜。

巨大な麦守り様の前に村長が立った。

ざわめきが静まる。

「今年も、この地に水がありました」

村人たちが頭を垂れる。

「土がありました」

「光がありました」

「我らが種を蒔き、育て、刈り取る日まで――今年も星環の光は、我らの上にありました」

村の術師が手を掲げる。

淡い術式が浮かんだ。

炎が生まれる。

最初は小さな火。

それが藁を伝い、たちまち巨大な炎へ変わった。

火の粉が夜空へ昇っていく。

その向こうには白い星環。

フレアは炎を見上げていた。

「きれい」

隣でナハトも目を細める。

「うん」

「前に見た村のお祭りと全然違う」

「そうだね」

「でも、どっちも好き」

ナハトは少し笑った。

「それでいいんじゃない？」

フレアは村人にならって手を合わせた。

目を閉じる。

「今年も、おいしいものが食べられますように」

ナハトが横を見る。

「それ来年のお願いじゃない？」

「あ」

フレアは一度目を開いた。

もう一度閉じる。

「今年も、おいしかったです」

「報告になった」

ヴォルトが笑う。

「祈り方に正解なんてないだろ」

「じゃあこれでいい」

炎は高く燃え続けた。

◇

その夜。

三人は村外れの納屋で、藁の上に毛布を敷いた。

屋根の向こうから、まだ祭りの歌が聞こえる。

「ねえ」

フレアの声が暗闇に響いた。

「旅って、いつもこうなの？」

ナハトは仰向けのまま答える。

「いや。雨降るし、野宿もするし、ろくな飯がない日もある」

「危ない仕事もある」

ヴォルトが付け足す。

「それに」

ナハトが横を向く。

「隣に、とんでもなくまずい茶を淹れる人がいる可能性もある」

暗闇の向こうでフレアが動いた。

「起きてるよ」

「聞こえるように言ったからね」

「明日も淹れる」

「ごめんなさい」

ヴォルトが笑いを堪えている。

しばらくして、また静かになった。

祭りの歌。

虫の声。

遠くで爆ぜる薪。

「でも」

フレアが言った。

「楽しいね」

ナハトは天井を見たまま黙っていた。

ヴォルトも何も言わない。

少しだけ間を置いて。

ナハトが答えた。

「……まあね」

誰も、それ以上は言わなかった。

炎は夜更けまで燃えていた。"},{"type":"chapter","title":"第七章","sub":"魔法が使えない日","text":""},{"type":"text","text":"アウレを出て数日。レグルスへ向かう途中、三人は城塞都市カルディアへ立ち寄った。

門をくぐったところで、フレアが足を止める。

「……静かだね」

高い石壁。

何本もの塔。

商店が連なる大通り。

人の数だけなら、ノルンより多い。

なのに――妙に静かだった。

ナハトが周囲を見る。

「確かに」

普段なら街路を走っているはずの導機車が、一台もない。

建物の軒先にある導機灯も消えている。

広場の噴水も止まっていた。

ヴォルトだけが納得した顔をする。

「休律日か」

「何それ」

ナハトが尋ねる。

「年に一度、公共の魔力供給を止める日。幹線から導機までまとめて点検する」

「つまり？」

フレアが聞く。

「街の魔法を一日休ませる」

ナハトは少し考えた。

「俺、毎日休律日みたいなもんだけど」

ヴォルトが即座に振り返る。

「お前と一緒にすんな」

フレアが笑った。

◇

市場では、いつも導機が担っている仕事を人がやっていた。

魚屋の男が大きな氷塊を抱えて走っている。

「どけどけ！　溶ける！」

荷運びの男たちは汗だくで荷車を押す。

パン屋では、魔法式の炉を使えないのか、昔ながらの薪窯から煙が上がっていた。

フレアは珍しそうに見ている。

ただ、困惑はしていない。

「村みたい」

「そう？」

ナハトが尋ねる。

「アウレも、魔法なくても大体動いてた」

「都市は違うぞ」

ヴォルトが止まった導機車を指した。

「あれも。水も。街灯も。工房も。規模が大きいほど魔法に頼ってる」

そのとき。

向かいの大商店の扉が開いた。

中から冷たい空気が流れてくる。

フレアが振り返る。

「そこ、動いてる」

「私設設備だな」

「休律日なのに？」

「自前の魔力槽を持ってれば止める必要はない」

ナハトが店先を見る。

値札も、客の服も、周囲とは一段違う。

「便利も買えるってことね」

ヴォルトは何も言わなかった。

◇

しばらく歩くと、鐘が鳴った。

大きな建物から子どもたちが出てくる。

市立術学院。

中庭ではまだ授業が続いていた。

教師が黒板へ術式を書いている。

「観測を先に」

「結果を予測してから循環を組む」

「順番を飛ばすな」

生徒の一人が、桶の水へ手を向けた。

淡い光の線。

円。

その内部に細かな構造が組み上がる。

水が浮き――。

ぱしゃん。

全部落ちた。

周囲から笑い声。

「笑わない！」

教師の声が飛ぶ。

「最初からできる者などいない。もう一度！」

生徒は唇を噛み、もう一度術式を組む。

今度は小さな水球が浮いた。

「できた！」

フレアが嬉しそうに笑う。

「よかった」

ナハトは壁にもたれた。

「優しいね」

「失敗してたから」

ヴォルトは黒板を見ている。

「基本的な循環制御だな」

フレアが尋ねた。

「みんな、同じ形でやるんだね」

「基礎だからな」

「魔法なのに？」

「魔法だからだよ」

ヴォルトが答える。

「同じ手順なら、同じ結果を出せる。それが大事なんだ」

フレアは自分の手を見る。

「私は、ああやってできない」

ナハトが隣を見る。

「そうなの？」

「たぶん」

「たぶん？」

「やったことないから」

ヴォルトが眉間を押さえた。

「お前、本当に今までどうやって魔法使ってたんだよ……」

「普通に」

「その『普通』を説明してくれ」

「触ったら分かるよ」

「分からないから聞いてる！」

ナハトが笑う。

「専門家、大変そうだね」

「誰の仲間だと思ってんだ！」

フレアがナハトを見る。

「ナハトは？」

「俺？」

ナハトは中庭の術式を眺めた。

「俺はそもそもできないよ」

軽い声だった。

いつもの調子。

それでもフレアは少しだけ彼を見ていた。

ナハトは気づかないふりをした。

「ほら。毎日休律日」

「気に入ったのか、その言い方」

◇

宿はどこも満室だった。

休律日のために各地から技師や職人が集まっているらしい。

四軒目。

ようやく屋根裏部屋が一つ空いていた。

宿の主人が三人を見る。

「狭いぞ？」

ナハトが部屋を見る。

寝台二つ。

床一つ。

「十分です」

フレアが尋ねる。

「今日は三人で？」

「屋根には勝てません」

「前は仕事に負けたよね」

「覚えてるねえ」

「街の決まり、意外と弱い」

「法律じゃないって言っただろ」

ヴォルトが呆れる。

◇

荷物を置いたあと。

ヴォルトに引っ張られる形で、三人は工房街へ向かった。

普段は石板で塞がれている街路が、何箇所も開けられている。

その下には太い管。

金属線。

結晶板。

無数の魔力回路。

フレアは穴の縁から覗いた。

「街の下、こんなになってるんだ」

ヴォルトの目が生き生きしていた。

「主幹線だ。ここから各区画へ流れを分ける」

「水路みたい」

「近い」

「血管にも見える」

ヴォルトが少し考える。

「……それも悪くない」

地下では術師だけではなく、石工や配管工、人夫たちが一緒に働いていた。

一人が術式を確認する。

一人が管を持ち上げる。

一人が石のひびを埋める。

フレアが眺める。

「魔法使いだけで直すんじゃないんだ」

「術式が正しくても、管が割れてたら流れない」

ヴォルトは工具を持った職人たちを見た。

「導機が動いてても、土台が崩れれば終わりだ」

ナハトが言う。

「世の中、一人じゃ何もできないねえ」

ヴォルトが横目で見る。

「お前が言うと妙に説得力あるな」

「褒めた？」

「違う」

◇

午後。

丘の上へ登ると、景色が変わった。

噴水が動いている。

庭の導機灯も点いている。

静かな導機車まで走っていた。

フレアが足を止める。

「ここもカルディアだよね」

「そうだな」

ヴォルトが答える。

坂の下。

人々は桶を抱え、共同井戸に並んでいる。

坂の上。

庭では水が噴き上がっていた。

誰も説明しなかった。

しばらくしてフレアが言う。

「下にも少しあげればいいのに」

ヴォルトが息を吐く。

「そう思うよな」

「できないの？」

「できる」

「じゃあ――」

「でも、誰が払うとか。誰が管理するとか。いつまでやるとか。そういう話になる」

フレアは噴水を見た。

「面倒だね」

ナハトが肩をすくめる。

「世の中、大体そんなもんだよ」

フレアが彼を見る。

「ナハト、それ嫌いそう」

一瞬。

ナハトの返事が遅れた。

「……何が？」

「『仕方ない』ってやつ」

「そう？」

「うん」

「買いかぶりじゃない？」

フレアはそれ以上言わなかった。

ヴォルトも。

ナハトだけが歩き出した。

「腹減ったな」

ヴォルトが小さく笑った。

「逃げた」

「聞こえてます」

◇

坂を下りると、下町では若者たちが大きな樽を荷車に積んでいた。

「一軒一杯！」

「年寄りの家優先！」

「うちは後でいい！」

共同炊事用の導機も止まっているため、通りの中央では大鍋がいくつも火にかけられていた。

「旅人かい？」

鍋を混ぜていた老婆が声をかける。

「食べてく？　一杯、大銅貨一枚だよ」

フレアがナハトを見る。

「いい？」

「俺に聞くの？」

「じゃあ食べる」

「判断早いなあ」

ナハトも鍋を覗く。

「三人分お願いします」

老婆はナハトを上から下まで見る。

「兄ちゃんは大盛りにしとくよ」

「なんで？」

「食べそうだから」

ナハトは財布を出した。

「見る目あるなあ」

ヴォルトが頭を抱える。

「そこは否定しろよ」

三人は道端に座って煮込みを食べた。

フレアは周囲を見る。

誰かが水を運ぶ。

誰かがパンを切る。

子どもが皿を配っている。

「こっちは楽しそう」

ナハトが言う。

「水出ないけど？」

「困ってるのと、楽しいのは一緒にあっていいでしょ」

ヴォルトが少し笑う。

「……そうだな」

フレアが彼を見る。

◇

夕刻。

鐘が三度鳴った。

街の中心にある塔が白く光る。

そこから一本。

また一本。

街路の導機灯が灯っていく。

揚水機が動き出す。

噴水が上がる。

工房から歓声が聞こえた。

街全体が、ゆっくり息を吹き返していく。

フレアは目を見開いた。

「すごい」

ヴォルトは少し誇らしげに笑った。

「だろ？」

「ヴォルトがやったの？」

「違う」

「じゃあなんで嬉しそうなの？」

「いいだろ別に」

ナハトが横から笑う。

「好きなんだねえ」

「うるさい」

◇

その夜。

屋根裏部屋。

ナハトは床。

ヴォルトとフレアが寝台を一つずつ使っていた。

「ナハト、そこ寒くない？」

フレアが上から覗く。

「傭兵を舐めないでください」

「寒いんだ」

「ちょっと」

ヴォルトが毛布を一枚投げた。

ナハトの顔に乗る。

「ありがとう」

「どういたしまして」

しばらくして、フレアが言った。

「最初、魔法が使えない日なのかと思ってた」

「休律日？」

「うん。でも違った」

ヴォルトが寝返りを打つ。

「何が？」

「使えないんじゃなくて、街の方が止めてたんだね」

「点検するためにな」

「なくても生きられる。でも、あるからできることもいっぱいある」

ナハトが毛布から顔を出す。

「難しいね、魔法」

「お前が言うな」

「使えないからこその客観的意見ですよ」

フレアが天井を見る。

「ナハトも使えたら便利なのにね」

「俺？」

「うん」

ナハトは少し笑った。

「刀があるから十分」

それで話は終わった。

少なくとも、ナハトの中では。

窓の外。

カルディア中央の大聖堂に、色とりどりの旗が飾られている。

フレアが身を起こした。

「あれ、婚礼？」

ヴォルトも窓を見る。

「ああ。明日みたいだな」

「大きいね」

「貴族か大商会じゃないか？」

フレアの目が輝く。

「見たい」

ナハトは嫌な予感がした。

「見たことないの？」

「村のはあるよ。教会でやる大きいのはない」

「なるほど」

「見たい」

「他人の結婚式だよ」

「外からならいいでしょ？」

「まあ……」

「見たい」

ナハトはヴォルトを見る。

ヴォルトは目を逸らした。

「俺を見るな」

「明日、出発できると思う？」

「……諦めろ」

祝福の鐘が鳴る。

フレアは窓の外を見たまま笑った。"},{"type":"chapter","title":"第八章","sub":"星環の花嫁","text":""},{"type":"text","text":"「見えない」

翌朝。

カルディア中央区。

星環教会前の大通りは、人で埋め尽くされていた。

花飾り。

楽師。

色とりどりの旗。

その向こうに白い大聖堂がそびえている。

フレアは人垣の後ろでぴょんと跳ねた。

「見えない」

ナハトは早くも諦めていた。

「二回言っても見えないものは見えないよ」

フレアが振り返る。

「ナハト」

「嫌です」

「まだ何も言ってない」

「肩でしょ」

「うん」

「嫌です」

「分かった」

フレアはヴォルトを見る。

ヴォルトは杖を一歩遠ざけた。

「俺も無理だからな」

「まだ言ってない」

「同じ流れだろ」

◇

今日の婚礼は、地方大商会の跡取りと、古い貴族家の娘。

教会で式を挙げたあと、二人は馬車で中央通りを巡るらしい。

フレアは周囲の花飾りを見回した。

「村の結婚式と全然違う」

「そりゃそうだろ」

ヴォルトが答える。

「村じゃこんな人数集まらない」

「こんなに知らない人が来るんだ」

「家同士の付き合いもあるし、商売にも関わるからな」

フレアが彼を見る。

「結婚なのに？」

「結婚だから、だな」

「好きな人とするんじゃないの？」

ナハトが肩をすくめた。

「それが一番幸せだけどね」

「違うこともある？」

「ある」

ヴォルトが答える。

「家。土地。商売。立場。そういうものを結ぶための結婚もある」

フレアは大聖堂を見上げた。

「街の結婚、背負うもの多いね」

ナハトが少し笑う。

「いい言い方するね」

◇

鐘が鳴った。

大聖堂の扉が開く。

人垣が一気に動く。

しかし――何も見えない。

フレアが背伸びする。

「やっぱり見えない」

「帰る？」

「もう少し」

そのとき。

「すみません！」

横から走ってきた若い男がナハトへぶつかった。

抱えていた花籠が傾く。

白い花が大量に石畳へ散った。

「あ」

男の顔が青くなる。

「どうしよう、これ式で使うやつ――！」

ナハトは足元の花を見る。

男を見る。

もう一度花を見る。

「大変ですね」

「手伝ってください！」

「なんで？」

「今、目が合いました！」

「理由が弱い」

それでも。

数分後。

三人は花籠を抱えて、大聖堂の裏口を歩いていた。

ナハトが呟く。

「なんでこうなった」

隣でフレアが嬉しそうに歩いている。

「中、見れる」

「結果だけ見れば大成功だね」

ヴォルトが呆れた。

「お前が断らないからだろ」

「困ってる人を見捨てられない優しい男なので」

「押しに弱いだけだ」

◇

大聖堂の中は、外の喧騒が嘘のように静かだった。

白い石床。

高い天井。

色硝子から差し込む光。

壁や柱には銀色の輪が刻まれている。

その廊下で、澄んだ声がした。

「そちらの花は、中庭へお願いします」

三人が振り返る。

腰近くまで流れる淡い銀青の髪。

細い編み込みを交え、後ろで上品にまとめられている。

白と濃紺を重ねた礼装。

胸元には青い石と、小さな星環の意匠。

派手ではない。

それなのに、一目で育ちの違いが分かる。

女性は三人を見て。

その中でも、黒ずくめのナハトで一度視線を止めた。

「……ずいぶん目立つお手伝いの方ですね」

ナハトも彼女を見る。

一瞬の間。

それから、いつもの笑顔になる。

「これはこれは。運命ですかね」

女性は即答した。

「初対面ですので、偶然です」

「即答」

ヴォルトが横で小さく息を吐く。

「知り合いじゃねえのかよ」

「今、知り合うところ」

「セレナ・アクアレイと申します」

女性――セレナが軽く会釈した。

◇

フレアはセレナをじっと見ていた。

セレナが少し困ったように微笑む。

「……何でしょう？」

「きれい」

「ありがとうございます」

「髪も」

「ありがとうございます」

「服も」

「フレア」

ナハトが横から止める。

「全部一個ずつ言わなくていいから」

フレアはナハトを見る。

「本当だよ？」

「疑ってないよ」

セレナが小さく笑った。

「あなたの髪も、とても綺麗ですね」

フレアの表情が明るくなる。

「ありがとう」

ナハトがヴォルトへ囁いた。

「早いな」

「何が」

「仲良くなるの」

「お前と違って余計なこと言わないからじゃないか？」

「刺さるねえ」

◇

セレナは花嫁となる貴族の娘と面識があり、今日は教会側の手伝いも兼ねて来ていた。

花を中庭へ運ぶ途中。

フレアの足が止まった。

建物の一角。

扉の向こうに、寝台が並んでいる。

「ここ、何？」

「施療院です」

セレナが答えた。

「教会で治療をしています」

中では白い服を着た治療師が、老人の腕へ包帯を巻いていた。

「お金がない人も来る？」

フレアが尋ねる。

「ええ」

セレナの声が少し柔らかくなる。

「すべてを無料にはできません。でも、払えない方を追い返さないよう、いくつかの家が支援しています」

「セレナの家も？」

「はい」

フレアは素直に言った。

「いいね」

セレナは一瞬だけ目を伏せた。

「……そうありたいと思っています」

ナハトは、その言い方を少しだけ気にした。

ただ、何も聞かなかった。

◇

中庭には子どもたちもいた。

教会で暮らしている子たちらしい。

走っていた一人が転ぶ。

そのすぐ横にいた子が手を差し出した。

「ほら」

「ありがと」

フレアが見ていた。

「ここが家なの？」

セレナが頷く。

「ええ」

「楽しそう」

「そう見えますか？」

「うん」

セレナは子どもたちを見た。

「……でしたら、よかった」

◇

式が始まった。

三人は、聖堂の一番端から見せてもらえることになった。

高い天井。

巨大な円環の意匠。

その上にある高窓から、本物の星環の白い光が差し込んでいる。

花嫁と花婿が並んだ。

祭司の声が聖堂へ響く。

「人は、一人で生まれます」

「けれど、一人で生きるものではありません」

ナハトの表情から、ほんの少しだけ笑みが薄れた。

「異なる道を歩んだ二人が、今日ここで、一つの道を選びます」

フレアは黙って聞いている。

ヴォルトも。

セレナも。

「星環が空を巡り、世界を包むように」

「互いを縛るためではなく」

「互いが帰る場所となるために」

花嫁が花婿を見る。

花婿も、彼女を見る。

「喜びの日も」

「悲しみの日も」

「豊かな日も」

「乏しき日も」

「その人の隣に立つことを、今日、自ら選びなさい」

二人が答える。

「はい」

鐘が鳴った。

拍手が起こる。

フレアも嬉しそうに手を叩いた。

ナハトが横から聞く。

「気に入った？」

「うん」

「こういうの、してみたい？」

フレアは少し考える。

そしてナハトを見る。

「ナハトと？」

ナハトの拍手が止まった。

ヴォルトが盛大に咳き込む。

「……なんで俺？」

「今、ナハトが聞いたから」

「一般論です」

「一般論？」

「そう」

「ナハトは嫌？」

一拍。

「そういう聞き方ずるくない？」

今度はセレナが口元を押さえた。

ヴォルトが肩を震わせている。

「笑うな」

「いや……悪い」

「全然悪そうじゃないね？」

フレアだけが不思議そうだった。

◇

式が終わる。

大聖堂の扉が開き、花嫁と花婿が外へ出ていく。

「花を！」

誰かが声を上げた。

フレアは籠から白い花を掴んだ。

「こう？」

「花嫁に向かって――」

ナハトが言い終える前に。

ぱっ。

白い花がナハトの頭上へ降った。

沈黙。

ナハトは頭に乗った花を取る。

「……俺、結婚するの？」

フレアが笑う。

「おめでとう」

「誰と？」

今度はヴォルトにも飛ぶ。

「おい！」

セレナまで一輪拾った。

ナハトが嫌な顔をする。

「セレナさん？」

「何でしょう？」

「まさか、投げませんよね？」

「まさか」

セレナは微笑んだ。

そして。

ぽい。

「裏切られた」

「貴族も人間ですから」

「その言葉、便利ですね」

◇

婚礼の馬車が大通りへ出た。

窓から花が降る。

知らない人々が手を振る。

子どもたちが走る。

店主まで店先から拍手していた。

フレアはそれを眺めている。

「みんな、二人のこと知ってるの？」

「ほとんど知らないでしょうね」

セレナが答える。

「じゃあ、なんでこんなに嬉しそうなの？」

セレナは少し考えた。

「幸せなことは」

馬車を見ながら言う。

「分けても減らないからではないでしょうか」

フレアはすぐ笑った。

「いいね、それ」

「ありがとうございます」

横からナハトが入る。

「俺が言ったことにしない？」

フレアが即答する。

「だめ」

「早いな」

セレナも頷く。

「だめです」

「味方いないの？」

「俺を見るな」

ヴォルトが言った。

◇

午後。

婚礼で余った料理の一部が、教会の施療院と子どもたちへ回された。

フレアは焼き菓子を配るのを手伝っていた。

「結婚式っていいね」

ナハトが壁にもたれたまま聞く。

「料理が？」

「それも」

「正直でよろしい」

「誰かが嬉しい日に、知らない人まで嬉しくなる」

フレアは子どもへ菓子を渡した。

「不思議」

セレナが隣で皿を運んでいる。

「毎日誰かが結婚すればいいのに」

フレアが言うと。

セレナは真顔で返した。

「神官が先に倒れます」

フレアが止まった。

ナハトが吹き出す。

「セレナさん、そういうこと言うんだ」

「現実的なだけです」

◇

夕方。

セレナは翌日にはアクアレイ家の屋敷へ戻るという。

フレアが少し残念そうな顔をした。

「また会える？」

「ええ」

「いつ？」

セレナが少し困る。

ナハトが横から囁いた。

「普通はそこで具体的な日を聞かないの」

「どうして？」

「社交辞令が死ぬから」

「しゃこうじれい」

「それくらいは知らなくてもいい」

「聞こえていますよ」

セレナが静かに言った。

ナハトが口を閉じる。

セレナはフレアを見る。

少し考えてから。

「では、社交辞令にはしません」

微笑む。

「また会いましょう」

フレアも笑った。

「うん」

◇

教会の門。

「では、お気をつけて」

セレナが頭を下げる。

「セレナも」

フレアが手を振る。

ナハトも軽く片手を上げた。

「じゃあ、また運命があれば」

セレナは即答した。

「偶然で十分です」

「最後まで手厳しい」

ヴォルトがナハトの背中を押した。

「行くぞ」

◇

その夜。

泊まっている宿の食堂。

フレアの皿の横には、教会でもらった白い花が一本置かれていた。

ナハトが指差す。

「それ、持ってくの？」

「うん」

「枯れるよ」

「乾かす」

「何にするの？」

フレアは花を見る。

「思い出」

ヴォルトは卓の上へ地図を広げていた。

「明日は北東街道。今度こそ間違えるなよ」

ナハトが不満そうに言う。

「一回だけじゃん」

「一回で十分だ」

食事を終え、ナハトが会計へ向かう。

主人が財布を見ながら尋ねた。

「明日の朝飯も付けるか？」

「お願いします」

「何人分？」

「三人」

答えはすぐに出た。

ナハトはそのまま硬貨を数える。

「朝早いから、持って出られるように包んでもらえる？」

「あいよ。三人分な」

後ろでヴォルトが地図を畳む。

フレアは白い花を大事そうに布へ包んでいる。

誰も何も言わなかった。

三人分。

それはもう、数え直すようなことではなかった。

◇

翌朝。

カルディアの門が開く。

朝日に照らされた街道へ、三つの影が伸びた。

遠くには山。

そのさらに向こう。

導機と魔法研究の都市レグルス。

ナハトが先頭へ出る。

「じゃ、行きますか」

ヴォルトがすぐに言った。

「地図貸せ」

「信用ないねえ」

「あると思ってたのか？」

フレアが手を差し出した。

「私が持つ」

ナハトが振り返る。

「フレアにまで！？」

「昨日ヴォルトに道教えてもらった」

「裏切り者！」

「教育だ」

「二対一じゃん！」

三人の笑い声が、朝の街道へ流れていった。

二人だった旅は。

もう、三人の旅になっていた。"}];
